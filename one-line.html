<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>One Line</title>
<meta name="description" content="One shape a day. It vanishes when you touch it. Trace it in one stroke. One try.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a single sheet of graph paper. Title, the drawing square, then the result slip beneath it. */
  :root {
    --paper: #f4f1ea;
    --sheet: #fbfaf6;
    --grid: #e2ddd0;
    --ink: #1b2a4a;
    --muted: #6b6a66;
    --red: #d6402b;
    --good: #2f9e5b;
    --warn: #e0a526;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #121418; --sheet: #191c22; --grid: #262a33; --ink: #dfe6ff; --muted: #9196a3; --red: #ff6a52; --good: #4cc97c; --warn: #f2bd45; color-scheme: dark; } }
  :root[data-theme="dark"] { --paper: #121418; --sheet: #191c22; --grid: #262a33; --ink: #dfe6ff; --muted: #9196a3; --red: #ff6a52; --good: #4cc97c; --warn: #f2bd45; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 14px; line-height: 1.5;
    padding-block: max(12px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 2.6rem; line-height: 1; }
  h1 i { color: var(--red); }
  .back { color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: 1.3rem; margin-right: 6px; }
  .meta { text-align: right; font-size: .72rem; color: var(--muted); line-height: 1.4; }
  .rule { margin: 0; font-size: .85rem; color: var(--muted); }
  .rule b { color: var(--ink); font-weight: 600; }
  .pad { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--sheet); border: 1px solid var(--grid); overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .hint { margin: -4px 0 0; text-align: center; font-size: .8rem; color: var(--muted); min-height: 1.5em; }
  .slip { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
  .score { font-family: var(--serif); font-size: 5.2rem; line-height: .9; font-variant-numeric: tabular-nums; }
  .score small { font-size: 2.2rem; }
  .label { font-family: var(--serif); font-style: italic; font-size: 1.6rem; line-height: 1; color: var(--red); }
  .segs { font-size: 1.5rem; letter-spacing: .06em; }
  .row { display: flex; gap: 10px; width: 100%; }
  button {
    flex: 1; font: 600 .95rem var(--mono); padding: 14px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  }
  button.solid { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; border-top: 1px dashed var(--grid); padding-top: 12px; }
  .stats b { display: block; font-family: var(--serif); font-size: 1.9rem; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats span { font-size: .64rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .note { margin: 0; font-size: .78rem; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1><a class="back" href="index.html" aria-label="Back to games">‹</a>One <i>Line</i></h1>
    <div class="meta" id="meta"></div>
  </header>
  <p class="rule" id="rule">Start on the <b>green dot</b>. The shape <b>vanishes</b> the moment you touch it. Trace it in one stroke. <b>One try.</b></p>

  <div class="pad" id="pad">
    <canvas id="c" aria-label="Drawing area"></canvas>
  </div>
  <p class="hint" id="hint" aria-live="polite">Study it. Then put your finger on the green dot.</p>

  <section class="slip" id="slip" hidden>
    <div class="score"><span id="score">0.0</span><small>%</small></div>
    <div class="label" id="label"></div>
    <div class="segs" id="segs"></div>
    <div class="row">
      <button class="solid" id="share" type="button">Share</button>
      <button id="practice" type="button">Practice</button>
    </div>
    <div class="stats" id="stats"></div>
    <p class="note" id="countdown"></p>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const N = 400;

  // --- day ---
  const EPOCH = new Date(2026, 9, 31);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dayNum = Math.round((today - EPOCH) / 864e5) + 1;
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayKey = ymd(today);
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // --- shapes: each returns raw points; we normalise and resample after ---
  const TAU = Math.PI * 2;
  const GEN = [
    ['Star', r => { const n = 5 + Math.floor(r() * 3), inner = .38 + r() * .17, rot = r() * TAU, pts = []; for (let i = 0; i <= n * 2; i++) { const a = rot + i * Math.PI / n, rr = i % 2 ? inner : 1; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }],
    ['Spiral', r => { const turns = 1.6 + r() * .9, dir = r() < .5 ? 1 : -1, pts = []; for (let i = 0; i <= 300; i++) { const t = i / 300, a = t * turns * TAU * dir, rr = .12 + t; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }],
    ['Knot', r => { const pairs = [[1, 2], [2, 3], [3, 2], [1, 3], [3, 4]], [a, b] = pairs[Math.floor(r() * pairs.length)], ph = r() < .5 ? Math.PI / 2 : Math.PI / 4, pts = []; for (let i = 0; i <= 400; i++) { const t = i / 400 * TAU; pts.push([Math.sin(a * t + ph), Math.sin(b * t)]); } return pts; }],
    ['Flower', r => { const k = 2 + Math.floor(r() * 4), span = k % 2 ? Math.PI : TAU, rot = r() * TAU, pts = []; for (let i = 0; i <= 400; i++) { const t = i / 400 * span, rr = Math.cos(k * t); pts.push([Math.cos(t + rot) * rr, Math.sin(t + rot) * rr]); } return pts; }],
    ['Heart', r => { const pts = []; for (let i = 0; i <= 300; i++) { const t = i / 300 * TAU; pts.push([16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]); } return pts; }],
    ['Wave', r => { const f = 1.5 + r() * 2, ph = r() * TAU, grow = r() < .5, pts = []; for (let i = 0; i <= 300; i++) { const x = -1 + i / 150, env = grow ? .3 + .7 * (i / 300) : 1; pts.push([x, Math.sin(x * f * Math.PI + ph) * .6 * env]); } return pts; }],
    ['Polygon', r => { const n = 3 + Math.floor(r() * 4), rot = r() * TAU, pts = []; for (let i = 0; i <= n; i++) { const a = rot + i * TAU / n; pts.push([Math.cos(a), Math.sin(a)]); } return pts; }],
    ['Bolt', r => { const n = 5 + Math.floor(r() * 3), pts = []; for (let i = 0; i <= n; i++) pts.push([-1 + 2 * i / n + (r() - .5) * .15, (i % 2 ? 1 : -1) * (.3 + r() * .6)]); return pts; }],
    ['Blob', r => { const p1 = r() * TAU, p2 = r() * TAU, a = .2 + r() * .15, b = .1 + r() * .1, pts = []; for (let i = 0; i <= 360; i++) { const t = i / 360 * TAU, rr = 1 + a * Math.sin(3 * t + p1) + b * Math.sin(5 * t + p2); pts.push([Math.cos(t) * rr, Math.sin(t) * rr]); } return pts; }],
    ['Loops', r => { const n = 3 + Math.floor(r() * 2), pts = []; for (let i = 0; i <= 400; i++) { const t = i / 400; const a = t * n * TAU; pts.push([-1 + 2 * t + Math.cos(a + Math.PI) * .25 + .25, Math.sin(a) * .4]); } return pts; }],
  ];

  function normalise(pts) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const s = 2 / Math.max(x1 - x0, y1 - y0), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return pts.map(([x, y]) => [(x - cx) * s, (y - cy) * s]);
  }
  function resample(pts, n) {
    const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = d[d.length - 1] || 1, out = []; let j = 0;
    for (let k = 0; k < n; k++) {
      const t = L * k / (n - 1);
      while (j < d.length - 2 && d[j + 1] < t) j++;
      const f = (t - d[j]) / ((d[j + 1] - d[j]) || 1);
      out.push([pts[j][0] + (pts[j + 1 > pts.length - 1 ? j : j + 1][0] - pts[j][0]) * f, pts[j][1] + (pts[j + 1 > pts.length - 1 ? j : j + 1][1] - pts[j][1]) * f]);
    }
    return { pts: out, len: L };
  }
  function makeShape(seed) {
    const r = rng(seed);
    const [name, gen] = GEN[Math.floor(r() * GEN.length)];
    const { pts, len } = resample(normalise(gen(r)), N);
    return { name, pts, len };
  }

  // --- canvas geometry ---
  let S = 300, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    S = $('pad').getBoundingClientRect().width;
    cv.width = cv.height = Math.round(S * DPR);
    draw();
  }
  const toPx = ([x, y]) => [S / 2 + x * S * .38, S / 2 + y * S * .38];
  const toN = (px, py) => [(px - S / 2) / (S * .38), (py - S / 2) / (S * .38)];

  // --- state ---
  let mode, shape, phase = 'look', stroke = [], fade = 1, result = null, replay = 1;
  let stats = load('ol-stats', { played: 0, streak: 0, best: 0, sum: 0, lastDay: null });

  function begin(m) {
    mode = m; stroke = []; result = null; fade = 1; phase = 'look'; replay = 1;
    shape = makeShape(m === 'daily' ? dayNum * 104729 + 7 : Math.floor(Math.random() * 1e9));
    $('slip').hidden = true; $('hint').hidden = false;
    $('hint').textContent = 'Study it. Then put your finger on the green dot.';
    $('meta').innerHTML = m === 'daily' ? `#${dayNum}<br>${today.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : 'Practice<br>not counted';
    draw();
  }

  // --- input ---
  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    if (phase !== 'look') return;
    const [px, py] = local(e), [sx, sy] = toPx(shape.pts[0]);
    if (Math.hypot(px - sx, py - sy) > Math.max(28, S * .07)) { $('hint').textContent = 'Start on the green dot.'; nudge(); return; }
    cv.setPointerCapture(e.pointerId);
    phase = 'draw'; stroke = [toN(px, py)]; $('hint').hidden = true;
    try { navigator.vibrate && navigator.vibrate(10); } catch (err) {}
    requestAnimationFrame(animate);
  });
  cv.addEventListener('pointermove', e => {
    if (phase !== 'draw') return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) { const [px, py] = local(ev); stroke.push(toN(px, py)); }
  });
  const end = () => {
    if (phase !== 'draw') return;
    const { len } = resample(stroke.length > 1 ? stroke : [stroke[0], stroke[0]], 2);
    if (len < shape.len * .12) { // an accidental tap shouldn't burn the day
      phase = 'look'; fade = 1; stroke = []; $('hint').hidden = false; $('hint').textContent = 'That was barely a line. Go again, from the green dot.'; draw(); return;
    }
    phase = 'done'; score();
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  function nudge() { $('pad').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 }); }

  // --- scoring ---
  function score() {
    const user = resample(stroke, N).pts, T = shape.pts;
    const nearest = (p, set) => { let m = Infinity; for (const q of set) { const d = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2; if (d < m) m = d; } return Math.sqrt(m); };
    const cov = T.map(p => nearest(p, user));          // did you cover every part of the shape?
    const prec = user.map(p => nearest(p, T));         // did you stay on it?
    const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
    const d = (mean(cov) + mean(prec)) / 2 / 2;         // as a fraction of the shape's size
    const pct = Math.min(99.9, Math.max(0, 100 * Math.exp(-4.5 * d)));
    const segs = []; for (let k = 0; k < 10; k++) { const m = mean(cov.slice(k * N / 10, (k + 1) * N / 10)) / 2; segs.push(m < .025 ? '🟩' : m < .06 ? '🟨' : '🟥'); }
    result = { pct: Math.round(pct * 10) / 10, segs: segs.join(''), prec, user };
    if (mode === 'daily') {
      const y = new Date(today); y.setDate(y.getDate() - 1);
      stats.streak = stats.lastDay === ymd(y) ? stats.streak + 1 : 1;
      stats.played++; stats.sum += result.pct; stats.best = Math.max(stats.best, result.pct); stats.lastDay = dayKey;
      store('ol-stats', stats);
      store('ol-day', { key: dayKey, pct: result.pct, segs: result.segs, user: user.filter((_, i) => i % 3 === 0).map(p => p.map(v => Math.round(v * 1000) / 1000)), prec: result.prec.filter((_, i) => i % 3 === 0).map(v => Math.round(v * 1000) / 1000) });
    }
    replay = 0; requestAnimationFrame(animate);
    try { navigator.vibrate && navigator.vibrate(result.pct >= 92 ? [30, 50, 30] : 20); } catch (e) {}
    setTimeout(showSlip, 900);
  }
  const LABEL = p => p >= 97 ? "Surgeon's hand" : p >= 92 ? 'Steady' : p >= 85 ? 'Pretty good' : p >= 75 ? 'Wobbly' : p >= 60 ? 'Earthquake' : 'Did you sneeze?';

  function showSlip() {
    $('slip').hidden = false;
    $('label').textContent = LABEL(result.pct);
    $('segs').textContent = result.segs;
    const el = $('score'); const t0 = performance.now();
    (function up(now) { const k = Math.min(1, (now - t0) / 700); el.textContent = (result.pct * (1 - Math.pow(1 - k, 3))).toFixed(1); if (k < 1) requestAnimationFrame(up); })(t0);
    const avg = stats.played ? (stats.sum / stats.played).toFixed(1) : '0';
    $('stats').innerHTML = `<div><b>${stats.played}</b><span>Played</span></div><div><b>${stats.streak}</b><span>Streak</span></div><div><b>${stats.best.toFixed ? stats.best.toFixed(1) : stats.best}</b><span>Best</span></div><div><b>${avg}</b><span>Average</span></div>`;
    $('rule').textContent = mode === 'daily' ? `Today's shape: ${shape.name.toLowerCase()}. Come back tomorrow for a new one.` : `Practice shape: ${shape.name.toLowerCase()}.`;
    $('slip').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // --- drawing ---
  function errColor(e) { e /= 2; return e < .015 ? getVar('--good') : e < .04 ? getVar('--warn') : getVar('--red'); }
  const varCache = {}; function getVar(n) { return varCache[n] ??= getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { for (const k in varCache) delete varCache[k]; draw(); });

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, S, S);
    // graph paper
    ctx.strokeStyle = getVar('--grid'); ctx.lineWidth = 1;
    const step = S / 16;
    for (let i = 1; i < 16; i++) { ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, S); ctx.moveTo(0, i * step); ctx.lineTo(S, i * step); ctx.stroke(); }
    if (!shape) return;
    const ink = getVar('--ink');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // the target: solid while studying, gone while drawing, dashed ghost for the result
    if (phase === 'look' || fade > 0) {
      ctx.globalAlpha = phase === 'look' ? 1 : fade;
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(3, S * .012);
      ctx.beginPath(); shape.pts.forEach((p, i) => { const [x, y] = toPx(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (phase === 'done') {
      ctx.strokeStyle = ink; ctx.globalAlpha = .35; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath(); shape.pts.forEach((p, i) => { const [x, y] = toPx(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

    // your stroke: plain ink while drawing, coloured by accuracy afterwards
    if (phase === 'draw' && stroke.length > 1) {
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(3, S * .011);
      ctx.beginPath(); stroke.forEach((p, i) => { const [x, y] = toPx(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
    }
    if (phase === 'done' && result) {
      const upto = Math.floor(result.user.length * replay);
      ctx.lineWidth = Math.max(3.5, S * .013);
      for (let i = 1; i < upto; i++) {
        const [x0, y0] = toPx(result.user[i - 1]), [x1, y1] = toPx(result.user[i]);
        ctx.strokeStyle = errColor(result.prec[i]); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }

    // start dot (and end ring for open shapes)
    const [sx, sy] = toPx(shape.pts[0]);
    const closed = Math.hypot(shape.pts[0][0] - shape.pts[N - 1][0], shape.pts[0][1] - shape.pts[N - 1][1]) < .05;
    if (phase !== 'done') {
      if (!closed && phase === 'look') { const [ex, ey] = toPx(shape.pts[N - 1]); ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey, S * .02, 0, TAU); ctx.stroke(); }
      const pulse = phase === 'look' ? 1 + Math.sin(performance.now() / 250) * .15 : 1;
      ctx.fillStyle = getVar('--good'); ctx.beginPath(); ctx.arc(sx, sy, S * .025 * pulse, 0, TAU); ctx.fill();
      // which way to go: a small arrow along the first stretch of the path
      if (phase === 'look') {
        const [ax, ay] = toPx(shape.pts[12]), ang = Math.atan2(ay - sy, ax - sx);
        ctx.save(); ctx.translate(sx + Math.cos(ang) * S * .06, sy + Math.sin(ang) * S * .06); ctx.rotate(ang);
        ctx.fillStyle = getVar('--good'); ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.fill(); ctx.restore();
      }
    }
  }

  function animate() {
    if (phase === 'draw') fade = Math.max(0, fade - .08);
    if (phase === 'done') replay = Math.min(1, replay + .03);
    draw();
    if (phase === 'look' || phase === 'draw' || (phase === 'done' && replay < 1)) requestAnimationFrame(animate);
  }

  // --- share ---
  $('share').addEventListener('click', async () => {
    const head = mode === 'daily' ? `One Line #${dayNum} ✍️ ${result.pct.toFixed(1)}%` : `One Line (practice) ✍️ ${result.pct.toFixed(1)}%`;
    const text = `${head}\n${result.segs}\n${LABEL(result.pct)}${mode === 'daily' && stats.streak > 1 ? ` · 🔥${stats.streak}` : ''}\n${location.href.split('#')[0]}`;
    if (navigator.share && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere.'); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); toast('Copied. Paste it anywhere.'); } catch (err) { toast('Could not copy on this browser.'); } ta.remove(); }
  });
  $('practice').addEventListener('click', () => { $('rule').innerHTML = 'Practice: same rules, random shape, <b>doesn\'t count</b>.'; begin('practice'); requestAnimationFrame(animate); });
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

  function tick() {
    const next = new Date(today); next.setDate(next.getDate() + 1);
    const s = Math.max(0, Math.floor((next - new Date()) / 1000));
    $('countdown').textContent = `Next shape in ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  setInterval(tick, 1000); tick();

  addEventListener('resize', resize);
  const saved = load('ol-day', null);
  begin('daily');
  resize();
  if (saved && saved.key === dayKey) {
    // already played today: show the result instead of a second try
    phase = 'done'; fade = 0; replay = 1;
    result = { pct: saved.pct, segs: saved.segs, user: saved.user, prec: saved.prec };
    $('hint').hidden = true; draw(); showSlip();
  } else requestAnimationFrame(animate);
})();
</script>
</body>
</html>
