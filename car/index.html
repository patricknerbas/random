<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f0eb">
<title>Second Look</title>
<meta name="description" content="Check a used car before you buy it. Guided photos, a quick checklist and an AI inspection report with a clear verdict.">
<meta property="og:title" content="Second Look: check a used car before you buy">
<meta property="og:description" content="Guided photos, a quick checklist and a clear verdict: buy, negotiate or walk away.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: a single phone-width column. Each step is one screen; the main action lives in a bar pinned to the bottom. */
  :root {
    --bg: #f2f0eb; --card: #ffffff; --ink: #1a1d21; --muted: #646a72; --line: #dedad1; --soft: #e9e6de;
    --sig: #f5b301; --sig-ink: #1a1d21;
    --ok: #1f9d55; --warn: #d98a00; --bad: #d33a2c; --unk: #7a808a;
    --display: "Archivo", "Arial Narrow", sans-serif;
    --body: "Public Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121417; --card: #1b1e23; --ink: #eef0f2; --muted: #9aa1aa; --line: #2c3036; --soft: #23272d; --sig: #ffc22e; --ok: #3cc47a; --warn: #f2a93b; --bad: #ff6a5c; --unk: #8e959f; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #121417; --card: #1b1e23; --ink: #eef0f2; --muted: #9aa1aa; --line: #2c3036; --soft: #23272d; --sig: #ffc22e; --ok: #3cc47a; --warn: #f2a93b; --bad: #ff6a5c; --unk: #8e959f; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.bar {
    position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; gap: 10px;
    padding-block: max(10px, env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.2rem; cursor: pointer; }
  .brand { font-family: var(--display); font-weight: 900; font-stretch: 85%; font-size: 1.3rem; letter-spacing: -.01em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--sig); display: inline-grid; place-items: center; font-style: normal; font-size: .8rem; color: var(--sig-ink); }
  .steps { margin-left: auto; font: 600 .78rem var(--mono); color: var(--muted); }
  main { flex: 1; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
  h1 { font-family: var(--display); font-weight: 900; font-stretch: 80%; font-size: clamp(2.3rem, 11vw, 3.2rem); line-height: .95; letter-spacing: -.01em; margin: 6px 0 0; text-transform: uppercase; text-wrap: balance; }
  h1 mark { background: var(--sig); color: var(--sig-ink); padding: 0 .12em; }
  h2 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 1.7rem; line-height: 1.05; margin: 4px 0 0; text-transform: uppercase; }
  h3 { font-family: var(--display); font-weight: 800; font-stretch: 90%; font-size: 1.05rem; margin: 0; text-transform: uppercase; letter-spacing: .02em; }
  .lede { color: var(--muted); margin: 0; font-size: 1.02rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: .82rem; font-weight: 600; color: var(--muted); min-width: 0; }
  input, select { font: 600 1rem var(--body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--sig); outline-offset: 2px; }
  .hint { margin: 0; font-size: .82rem; color: var(--muted); }
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .actionbar > div { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 800 1.05rem var(--display); font-stretch: 90%; text-transform: uppercase; letter-spacing: .04em; padding: 16px; border-radius: 14px; border: 0; cursor: pointer; background: var(--sig); color: var(--sig-ink); text-decoration: none; }
  .btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); flex: 0 0 auto; }
  .btn:disabled { opacity: .45; cursor: default; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font: 600 .74rem var(--mono); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  /* home */
  .how { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .how li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  .how b { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 .9rem var(--mono); }
  .how span { font-size: .95rem; }
  .how strong { display: block; }
  .past { display: flex; flex-direction: column; gap: 8px; }
  .past button { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; cursor: pointer; color: var(--ink); font: inherit; }
  .past img, .past .ph { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: var(--soft); }
  .past small { display: block; color: var(--muted); font-size: .8rem; }
  /* photos */
  .progress { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--sig); transition: width .3s; }
  .shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .shot { position: relative; border-radius: 14px; border: 1.5px dashed var(--line); background: var(--card); overflow: hidden; aspect-ratio: 4 / 3.6; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; }
  .shot.done { border-style: solid; border-color: var(--ok); }
  .shot img.thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot .lbl { position: relative; padding: 8px 10px; background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff; font-weight: 700; font-size: .86rem; line-height: 1.2; }
  .shot svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shot:not(.done) svg.art { filter: saturate(.85); }
  .shot .cam { position: absolute; top: 8px; left: 8px; font: 600 .6rem var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; }
  .shot .req { position: absolute; top: 8px; right: 8px; font: 600 .62rem var(--mono); padding: 2px 6px; border-radius: 999px; background: var(--sig); color: var(--sig-ink); }
  .shot.done .req { background: var(--ok); color: #fff; }
  .shot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .tipbox { background: var(--soft); border-radius: 12px; padding: 12px; font-size: .88rem; }
  /* questions */
  .q { display: flex; flex-direction: column; gap: 10px; }
  .q p { margin: 0; font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .seg button { font: 700 .92rem var(--body); padding: 11px 6px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  /* analysing */
  .scan { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding-top: 40px; }
  .scan .ring { width: 120px; height: 120px; border-radius: 50%; border: 10px solid var(--soft); border-top-color: var(--sig); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scan ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; color: var(--muted); text-align: left; }
  .scan li.on { color: var(--ink); font-weight: 600; }
  .scan li.on::before { content: "▸ "; color: var(--sig); }
  /* report */
  .verdict { border-radius: 18px; padding: 18px; color: #fff; display: flex; flex-direction: column; gap: 6px; }
  .verdict.ok { background: var(--ok); } .verdict.warn { background: var(--warn); color: #1a1d21; } .verdict.bad { background: var(--bad); }
  .verdict small { font: 600 .74rem var(--mono); text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
  .verdict b { font-family: var(--display); font-weight: 900; font-stretch: 80%; font-size: 2.6rem; line-height: .95; text-transform: uppercase; }
  .verdict p { margin: 0; font-size: .95rem; }
  .score { display: flex; align-items: center; gap: 10px; font: 600 .82rem var(--mono); }
  .score .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); overflow: hidden; }
  .score .track i { display: block; height: 100%; background: currentColor; }
  .issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .issues li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; }
  .issues li::before { content: ""; width: 10px; border-radius: 5px; background: var(--unk); }
  .issues li.serious::before { background: var(--bad); } .issues li.moderate::before { background: var(--warn); } .issues li.minor::before { background: #c9b458; } .issues li.ok::before { background: var(--ok); }
  .issues b { display: block; font-size: .95rem; }
  .issues span { font-size: .88rem; color: var(--muted); }
  .src { font: 600 .66rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  ol.asks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
  .price { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .price div { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .price small { display: block; color: var(--muted); font-size: .76rem; font-weight: 600; }
  .price b { font: 600 1.25rem var(--mono); font-variant-numeric: tabular-nums; }
  .price .offer { grid-column: 1 / -1; background: color-mix(in srgb, var(--sig) 22%, var(--card)); }
  .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .gallery figure { margin: 0; background: var(--bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .gallery figcaption { padding: 8px 10px; font-size: .8rem; }
  .gallery figcaption b { display: block; font-size: .8rem; }
  .notice { border-radius: 12px; padding: 12px; font-size: .88rem; background: color-mix(in srgb, var(--warn) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .fine { font-size: .78rem; color: var(--muted); margin: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .88rem; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { .scan .ring { animation: none; } .progress i { transition: none; } }
  @media print {
    header.bar, .actionbar, .noprint { display: none !important; }
    body { background: #fff; color: #000; }
    main { padding: 0; }
    .card, .gallery figure { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="back" id="back" type="button" aria-label="Back" hidden>←</button>
    <div class="brand"><i aria-hidden="true">2</i>Second Look</div>
    <div class="steps" id="stepLbl"></div>
  </header>
  <main id="view" aria-live="polite"></main>
  <div class="actionbar" id="actionbar"><div id="actions"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // Where the AI photo analysis runs (the Vercel function in /api). When it isn't reachable,
  // reports are built from the checklist and price only, and say so.
  const ANALYZE_URL = new URL('../api/analyze', location.href).href;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = n => new Intl.NumberFormat().format(Math.round(n));

  // ---------- the walkaround ----------
  // example art for each tile: shaded drawings of a red example car, in a scene (200 x 150, shared gradients in #slDefs)
  const OUTDOOR = '<rect width="200" height="104" fill="url(#slSky)"/><rect y="104" width="200" height="46" fill="url(#slRoad)"/><path d="M0 104h200" stroke="#fff" stroke-opacity=".25"/><path d="M0 132h40M70 132h40M140 132h40" stroke="#e8e2c8" stroke-opacity=".35" stroke-width="2"/>';
  const CABIN = '<rect width="200" height="150" fill="url(#slCabin)"/>';
  const WHEEL = (x, y, rx = 13, ry = 13) => `<ellipse cx="${x}" cy="${y}" rx="${rx + 3}" ry="${ry + 3}" fill="#121315"/><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#1d1e21"/><ellipse cx="${x}" cy="${y}" rx="${rx * .62}" ry="${ry * .62}" fill="url(#slRim)"/>` +
    [0, 72, 144, 216, 288].map(a => `<path d="M${x} ${y}L${(x + Math.cos(a * Math.PI / 180) * rx * .58).toFixed(1)} ${(y + Math.sin(a * Math.PI / 180) * ry * .58).toFixed(1)}" stroke="#7d8287" stroke-width="2"/>`).join('') +
    `<ellipse cx="${x}" cy="${y}" rx="${rx * .16}" ry="${ry * .16}" fill="#5b6066"/>`;
  const SHADOW = (cx, w) => `<ellipse cx="${cx}" cy="118" rx="${w}" ry="7" fill="url(#slShadow)"/>`;

  const ART_SIDE = OUTDOOR + SHADOW(100, 86) +
    '<path d="M18 106V90q2-9 15-11l26-4 20-17q6-5 16-5h38q9 0 15 6l15 15 16 4q8 2 9 11v13z" fill="url(#slPaintV)"/>' +
    '<path d="M84 62q4-3 11-3h17v16H70z" fill="url(#slGlass)"/><path d="M116 59h18q6 0 10 4l11 12h-39z" fill="url(#slGlass)"/>' +
    '<path d="M113 77v26M70 78l-2 25" stroke="#5e1414" stroke-width="1.2"/><rect x="96" y="83" width="10" height="2.5" rx="1" fill="#dcdcdc"/><rect x="124" y="83" width="10" height="2.5" rx="1" fill="#dcdcdc"/>' +
    '<path d="M20 86h12l2 5H20z" fill="#f4f1e6"/><path d="M181 84h-8v6h9z" fill="#c21d1d"/><path d="M30 80q60-6 150 2" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" fill="none"/>' +
    WHEEL(52, 104) + WHEEL(152, 104);

  const ART_CORNER = (lights) => OUTDOOR + SHADOW(104, 90) +
    '<path d="M70 104V83l22-17q6-5 16-5h32q8 0 13 6l14 13q13 2 15 10v14z" fill="url(#slPaintV)"/>' +
    '<path d="M18 106V87q2-8 13-10l39 6v21z" fill="url(#slPaintH)"/>' +
    '<path d="M31 77l39 6 22-17-34-4z" fill="#b52a2a"/><path d="M58 62l34 4 16-5-32-4z" fill="url(#slGlass)"/>' +
    '<path d="M96 66l12-4h16v14H90z" fill="url(#slGlass)"/><path d="M128 62h12q6 0 10 4l10 12h-32z" fill="url(#slGlass)"/>' +
    `<path d="M22 84l16 2-1 6-15-2z" fill="${lights}"/><path d="M50 88l16 2v6l-16-2z" fill="${lights}"/>` +
    '<rect x="36" y="94" width="18" height="6" rx="1.5" fill="#1a1a1c"/><path d="M80 82q50-6 104 4" stroke="#fff" stroke-opacity=".3" stroke-width="1.5" fill="none"/>' +
    WHEEL(30, 106, 8, 11) + WHEEL(86, 104, 11, 13) + WHEEL(162, 104, 12, 13);

  const ART_FRONT = (rear) => OUTDOOR + SHADOW(100, 76) +
    '<path d="M28 110V86q2-9 15-13l14-22q4-6 14-6h58q10 0 14 6l14 22q13 4 15 13v24z" fill="url(#slPaintH)"/>' +
    '<path d="M62 52q3-4 10-4h56q7 0 10 4l11 19H51z" fill="url(#slGlass)"/><path d="M40 72h120" stroke="#fff" stroke-opacity=".3"/>' +
    (rear
      ? '<path d="M34 80l26 2-2 9-24-2z" fill="#c21d1d"/><path d="M166 80l-26 2 2 9 24-2z" fill="#c21d1d"/><rect x="82" y="88" width="36" height="10" rx="1.5" fill="#f2f2ee" stroke="#333" stroke-width=".8"/><text x="100" y="95.6" font-size="6.5" text-anchor="middle" font-family="monospace" fill="#222">AB 123 C</text><rect x="44" y="104" width="10" height="4" rx="2" fill="#555"/>'
      : '<path d="M34 80l26 2-2 9-24-2z" fill="#f4f1e6"/><path d="M166 80l-26 2 2 9 24-2z" fill="#f4f1e6"/><rect x="72" y="83" width="56" height="12" rx="3" fill="#1b1b1e"/><path d="M76 87h48M76 91h48" stroke="#3a3a40"/><rect x="86" y="98" width="28" height="7" rx="1" fill="#f2f2ee"/>') +
    '<rect x="32" y="102" width="136" height="7" rx="3" fill="#7d1a1a"/><rect x="32" y="106" width="18" height="15" rx="3" fill="#18191b"/><rect x="150" y="106" width="18" height="15" rx="3" fill="#18191b"/>' +
    '<path d="M40 70l-8-2v6h8z" fill="#9e2121"/><path d="M160 70l8-2v6h-8z" fill="#9e2121"/>';

  const ART_TYRE = '<rect width="200" height="150" fill="#2a2b2e"/><path d="M0 0h200v30q-100-22-200 0z" fill="#8e1f1f"/><rect y="132" width="200" height="18" fill="url(#slRoad)"/>' +
    '<rect x="46" y="22" width="108" height="124" rx="22" fill="#1b1c1e"/><rect x="58" y="22" width="84" height="124" fill="#232427"/>' +
    [76, 100, 124].map(x => `<rect x="${x - 2.5}" y="22" width="5" height="124" fill="#0e0e10"/>`).join('') +
    Array.from({ length: 9 }, (_, i) => `<path d="M60 ${30 + i * 13}l14 6M86 ${33 + i * 13}l12-5M104 ${30 + i * 13}l12 6M128 ${33 + i * 13}l12-5" stroke="#0e0e10" stroke-width="2"/>`).join('') +
    '<path d="M46 40q-6 44 0 88M154 40q6 44 0 88" stroke="#3a3b3f" stroke-width="3" fill="none"/>';

  const ART_ENGINE = '<rect width="200" height="150" fill="#2e3034"/><path d="M0 0h200v18H0z" fill="#c9cdd2"/><path d="M0 0h200v6H0z" fill="#9aa0a6"/><path d="M0 18h14v132H0zM186 18h14v132h-14z" fill="url(#slPaintV)"/>' +
    '<rect x="62" y="44" width="78" height="64" rx="8" fill="#3f4248"/><rect x="66" y="48" width="70" height="56" rx="6" fill="#4a4e55"/>' +
    [56, 66, 76, 86, 96].map(y => `<path d="M74 ${y}h54" stroke="#3a3d43" stroke-width="3"/>`).join('') +
    '<circle cx="101" cy="98" r="5" fill="#e0b52b"/><rect x="22" y="70" width="32" height="34" rx="3" fill="#141416"/><circle cx="29" cy="68" r="3" fill="#c22"/><circle cx="47" cy="68" r="3" fill="#222" stroke="#666"/>' +
    '<rect x="148" y="34" width="26" height="32" rx="6" fill="#ddd6c4" fill-opacity=".9"/><rect x="148" y="48" width="26" height="18" rx="4" fill="#e889a7" fill-opacity=".8"/><circle cx="161" cy="34" r="5" fill="#222"/>' +
    '<rect x="150" y="84" width="22" height="30" rx="5" fill="#d9dde3" fill-opacity=".85"/><circle cx="161" cy="84" r="4.5" fill="#2b6fd6"/><circle cx="34" cy="38" r="9" fill="#55595f"/><circle cx="168" cy="128" r="9" fill="#55595f"/>' +
    '<path d="M62 120q40 10 78 0" stroke="#111" stroke-width="4" fill="none"/>';

  const CLUSTER = '<rect x="20" y="22" width="160" height="92" rx="40" fill="#0f1012"/><rect x="24" y="26" width="152" height="84" rx="36" fill="#17181b"/>' +
    [[64, 66], [136, 66]].map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="30" fill="#0b0b0d" stroke="#3a3c42" stroke-width="2"/>` +

  // resize in the browser so uploads are fast and small
  async function shrink(file, max, quality) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
    const img = bmp || await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  }

    let k = 0; const timer = setInterval(() => { k = Math.min(stages.length - 1, k + 1); document.querySelectorAll('#stages li').forEach((li, i) => li.className = i === k ? 'on' : ''); }, 4000);
    let ai = null, aiError = '';
    try {
      const res = await fetch(ANALYZE_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          car: check.car, answers: check.answers, lang: navigator.language || 'en',

        }),

      if (res.ok && data && data.inspection) ai = data.inspection;
      else aiError = res.status === 404 || !data ? 'not-connected' : (data.error || 'failed');

  async function makeThumbs() {

  // ---------- the report: checklist rules + price + AI photo findings ----------
  function buildReport(ai, aiError) {
    const issues = [], asks = [], mechanic = [], checks = [];
    for (const q of QUESTIONS) {
      const a = check.answers[q.id];
      if (a === q.bad) { issues.push({ sev: q.sev, title: q.flag, detail: q.why, src: 'Checklist' }); }
      else if (a === 'unsure') checks.push(q.q.replace(/\?$/, '') + ': check this before you pay.');
    }
    // price
    const c = check.car, asking = +c.asking || 0, market = +c.market || 0;
    let priceNote = '';
    if (asking && market) {
      const diff = (asking - market) / market;
      if (diff > .1) { issues.push({ sev: 'moderate', title: `Priced ${Math.round(diff * 100)}% above similar cars`, detail: `Similar cars are listed around ${c.currency}${nf(market)}.`, src: 'Price' }); }
      priceNote = diff > .1 ? 'Above the market' : diff < -.15 ? 'Well below the market: ask why' : 'In line with the market';
      if (diff < -.15) asks.push('Why is it priced so far below similar cars?');
    }
    // AI photo findings
    const photoNotes = {};
    if (ai) {
      for (const f of ai.photo_findings || []) {
        const shot = SHOTS.find(s => s.id === f.shot);
        photoNotes[f.shot] = f;
        if (f.severity && f.severity !== 'ok') issues.push({ sev: f.severity, title: (shot ? shot.label : f.shot), detail: f.finding, src: 'Photo' });
      }
      for (const w of ai.dashboard_warnings || []) issues.push({ sev: 'serious', title: `Warning light: ${w}`, detail: 'Seen on the dashboard photo with the engine running.', src: 'Photo' });
      // odometer vs listing
      const read = parseInt(String(ai.odometer_reading || '').replace(/[^\d]/g, ''), 10), listed = +c.mileage || 0;
      if (read && listed && Math.abs(read - listed) / listed > .05) {
        issues.push({ sev: 'serious', title: 'Odometer doesn’t match the listing', detail: `The photo reads about ${nf(read)}, the listing says ${nf(listed)} ${c.unit}.`, src: 'Photo' });
      }
      asks.push(...(ai.questions_for_seller || []));
      mechanic.push(...(ai.mechanic_focus || []));
    }
    // standard seller questions, always useful
    asks.push('When was the last service, and what was done?', 'Has the timing belt or chain been replaced?', 'Why are you selling it?');
    issues.sort((a, b) => SEV_RANK[a.sev] - SEV_RANK[b.sev]);
    const count = s => issues.filter(i => i.sev === s).length;
    const score = Math.max(0, 100 - issues.reduce((t, i) => t + (SEV_POINTS[i.sev] || 0), 0));
    const dealBreaker = ['owner', 'damp'].some(id => check.answers[id] === QUESTIONS.find(q => q.id === id).bad) || issues.some(i => /Odometer/.test(i.title));
    let verdict;
    if (dealBreaker || count('serious') >= 2 || score < 55) verdict = { label: 'Walk away', tone: 'bad', text: 'Too many serious problems for the risk. Keep looking unless a mechanic says otherwise and the price drops a lot.' };
    else if (count('serious') === 1 || score < 85) verdict = { label: 'Negotiate', tone: 'warn', text: 'Worth considering, but the issues below should come off the price. Get a mechanic to confirm them.' };
    else verdict = { label: 'Looks good', tone: 'ok', text: 'Nothing major showed up. Still have a mechanic look it over before you pay.' };
    // opening offer: start from the lower of asking and market, take off for each issue (capped)
    let offer = 0;
    if (asking) {
      const base = market ? Math.min(asking, market) : asking;
      const cut = Math.min(.25, count('serious') * .06 + count('moderate') * .03 + count('minor') * .01);
      offer = Math.round(base * (1 - cut) / 50) * 50;
    }
    return {
      created: Date.now(), verdict, score, issues, asks: [...new Set(asks)].slice(0, 8), mechanic: [...new Set(mechanic)].slice(0, 6), checks,
      summary: ai ? ai.overall_summary : '', photoNotes, aiUsed: !!ai, aiError,
      price: { asking, market, offer, note: priceNote, currency: c.currency || '$' },
    };
  }

  function report() {
    const r = check.report; if (!r) return go('home');
    const thumbs = check.thumbs || {}, p = r.price;
    const real = r.issues.filter(i => i.sev !== 'ok');
    $('view').innerHTML = `
      <div class="verdict ${r.verdict.tone}">
        <small>${esc(carTitle())}</small>
        <b>${esc(r.verdict.label)}</b>
        <p>${esc(r.verdict.text)}</p>
        <div class="score"><span>Condition score</span><span class="track"><i style="width:${r.score}%"></i></span><span>${r.score}/100</span></div>
      </div>
      ${r.aiUsed ? '' : `<div class="notice">${r.aiError === 'not-connected' ? '<b>Photo analysis isn’t connected yet.</b> This report uses your checklist answers and the price only.' : `<b>The photo analysis didn’t finish</b> (${esc(r.aiError)}). This report uses your checklist answers and the price only.`}</div>`}
      ${r.summary ? `<div class="card"><h3>In short</h3><p style="margin:0">${esc(r.summary)}</p></div>` : ''}
      <div class="card">
        <h3>${real.length ? `${real.length} thing${real.length === 1 ? '' : 's'} to know` : 'No issues flagged'}</h3>
        ${real.length ? `<ul class="issues">${real.map(i => `<li class="${i.sev}"><div><span class="src">${esc(i.src)} · ${esc(i.sev)}</span><b>${esc(i.title)}</b><span>${esc(i.detail)}</span></div></li>`).join('')}</ul>` : '<p class="hint">Nothing from your photos or answers raised a concern.</p>'}
      </div>
      ${p.asking ? `<div class="card"><h3>Price</h3><div class="price">
        <div><small>Asking</small><b>${esc(p.currency)}${nf(p.asking)}</b></div>
        <div><small>Similar cars</small><b>${p.market ? esc(p.currency) + nf(p.market) : '—'}</b></div>
        <div class="offer"><small>Suggested opening offer</small><b>${esc(p.currency)}${nf(p.offer)}</b></div>
      </div><p class="hint">${p.note ? esc(p.note) + '. ' : ''}The offer starts from the lower of the asking and market price and takes off for each issue found. Use the list above to justify it.</p></div>` : ''}
      <div class="card"><h3>Ask the seller</h3><ol class="asks">${r.asks.map(a => `<li>${esc(a)}</li>`).join('')}</ol></div>
      ${r.checks.length || r.mechanic.length ? `<div class="card"><h3>Check before you pay</h3><ol class="asks">${[...r.checks, ...r.mechanic].map(a => `<li>${esc(a)}</li>`).join('')}</ol></div>` : ''}
      ${Object.keys(thumbs).length ? `<div class="card"><h3>Your photos</h3><div class="gallery">${SHOTS.filter(s => thumbs[s.id]).map(s => {
        const n = r.photoNotes[s.id];
        return `<figure><img src="${thumbs[s.id]}" alt="${esc(s.label)}"><figcaption><b>${esc(s.label)}</b>${n ? `<span class="src">${esc(n.severity)}</span> ${esc(n.finding)}` : ''}</figcaption></figure>`;
      }).join('')}</div></div>` : ''}
      <p class="fine">This report is based on photos and your answers. It can’t see inside the engine, gearbox or brakes. Have a qualified mechanic inspect the car and check its official history before you pay.</p>`;
    actions(`<button class="btn ghost" type="button" id="pdf">Save PDF</button><button class="btn" type="button" id="share">Share report</button>`);
    $('pdf').onclick = () => window.print();
    $('share').onclick = shareReport;
  }

  async function shareReport() {
    const r = check.report, p = r.price;
    const lines = [`${carTitle()}: ${r.verdict.label} (${r.score}/100)`];
    r.issues.filter(i => i.sev !== 'ok').slice(0, 6).forEach(i => lines.push(`• ${i.title}`));
    if (p.asking) lines.push(`Asking ${p.currency}${nf(p.asking)} · suggested offer ${p.currency}${nf(p.offer)}`);
    lines.push('', 'Checked with Second Look: ' + location.href.split('#')[0]);
    const text = lines.join('\n');
    if (navigator.share) { try { await navigator.share({ title: 'Second Look report', text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); toast('Report copied. Paste it anywhere.'); } catch (e) { toast('Use Save PDF to keep the report.'); }
  }

  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
  render();
})();
</script>
</body>
</html>
