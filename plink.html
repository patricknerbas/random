<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f3a30">
<title>Plink</title>
<meta name="description" content="Draw chalk ramps to guide a marble into the cup. Every bounce plays a note. One board a day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: a school chalkboard. Header, the board (drawing + physics), a chalk tray of controls, then the result slip. */
  :root {
    --frame: #6b4a2b;
    --board: #1f3a30;
    --chalk: #f1efe6;
    --dust: #a9bfb2;
    --pink: #ff9fb8;
    --yellow: #ffe17a;
    --blue: #8fd3ff;
    --hand: "Gaegu", "Comic Sans MS", cursive;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: #14231d; color: var(--chalk); font-family: var(--mono); font-size: 13px; line-height: 1.5;
    padding-block: max(12px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none; user-select: none;
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 2.8rem; line-height: .9; }
  h1 span { color: var(--pink); }
  .back { color: var(--dust); text-decoration: none; font-family: var(--mono); font-size: 1.3rem; margin-right: 6px; }
  .meta { text-align: right; font-size: .7rem; color: var(--dust); line-height: 1.4; }
  .frame { border: 10px solid var(--frame); border-radius: 8px; box-shadow: inset 0 0 0 2px #4a321c, 0 16px 40px -16px #000; background: var(--board); }
  .boardbox { position: relative; width: 100%; aspect-ratio: 3 / 4; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .msg { font-family: var(--hand); font-size: 1.35rem; text-align: center; min-height: 1.6em; line-height: 1.2; }
  .ink { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .72rem; color: var(--dust); }
  .ink .bar { height: 8px; border-radius: 4px; background: #2c4a3e; overflow: hidden; }
  .ink .bar i { display: block; height: 100%; background: var(--chalk); width: 100%; transition: width .1s; }
  .tray { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; }
  button { font: 700 .85rem var(--mono); color: var(--chalk); background: #29473b; border: 1px solid #3c6253; border-radius: 10px; padding: 12px 8px; cursor: pointer; touch-action: manipulation; }
  button.go { background: var(--pink); color: #2b1018; border-color: var(--pink); font-family: var(--hand); font-size: 1.5rem; padding: 6px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
  .card { background: #29473b; border: 1px dashed var(--dust); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
  .card h2 { margin: 0; font-family: var(--hand); font-size: 2.6rem; line-height: 1; color: var(--yellow); }
  .card .tune { font-family: var(--hand); font-size: 1.3rem; color: var(--blue); word-break: break-word; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row button { flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; border-top: 1px dashed #3c6253; padding-top: 10px; }
  .stats b { display: block; font-family: var(--hand); font-size: 1.8rem; line-height: 1; }
  .stats span { font-size: .6rem; color: var(--dust); text-transform: uppercase; letter-spacing: .08em; }
  .note { margin: 0; font-size: .72rem; color: var(--dust); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chalk); color: var(--board); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1><a class="back" href="index.html" aria-label="Back to games">‹</a>Pl<span>i</span>nk</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="msg" id="msg">Draw ramps with your finger. Then drop the marble.</div>
  <div class="frame"><div class="boardbox" id="box"><canvas id="c" aria-label="Chalkboard. Draw lines to guide the marble."></canvas></div></div>
  <div class="ink"><span>Chalk</span><div class="bar"><i id="inkbar"></i></div><span id="inkpct">100%</span></div>
  <div class="tray" id="tray">
    <button id="undo" type="button">Undo</button>
    <button id="clear" type="button">Wipe</button>
    <button class="go" id="drop" type="button">Drop it ♪</button>
  </div>
  <section class="card" id="done" hidden>
    <div class="note" id="doneLabel"></div>
    <h2 id="stars">★★★</h2>
    <div id="summary"></div>
    <div class="tune" id="tune"></div>
    <div class="row"><button id="replay" type="button">Play my tune</button><button class="go" id="share" type="button">Share</button></div>
    <div class="row"><button id="practice" type="button">Practice board</button></div>
    <div class="stats" id="stats"></div>
    <p class="note" id="countdown"></p>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const WW = 360, WH = 480;             // world units; the board scales to fit
  const BALL = 8, G = 620, INK_MAX = 560;

  const EPOCH = new Date(2026, 9, 31);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dayNum = Math.round((today - EPOCH) / 864e5) + 1;
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayKey = ymd(today);
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // --- level ---
  function makeLevel(seed) {
    const r = rng(seed);
    const spout = { x: 50 + r() * 260, y: 34 };
    let cupX; do { cupX = 50 + r() * 260; } while (Math.abs(cupX - spout.x) < 130);
    const cup = { x: cupX, y: 452, w: 58, h: 40 };
    const bars = [];
    const n = 3 + Math.floor(r() * 3);
    for (let tries = 0; bars.length < n && tries < 200; tries++) {
      const len = 60 + r() * 80, ang = (r() - .5) * 1.6, cx = 40 + r() * 280, cy = 110 + r() * 260;
      const a = { x: cx - Math.cos(ang) * len / 2, y: cy - Math.sin(ang) * len / 2 }, b = { x: cx + Math.cos(ang) * len / 2, y: cy + Math.sin(ang) * len / 2 };
      if (Math.min(a.x, b.x) < 8 || Math.max(a.x, b.x) > WW - 8) continue;
      if (Math.abs(cx - cup.x) < 70 && cy > 330) continue;            // keep the cup reachable
      if (bars.some(o => Math.hypot((o.a.x + o.b.x) / 2 - cx, (o.a.y + o.b.y) / 2 - cy) < 80)) continue;
      bars.push({ a, b });
    }
    // one bar right under the spout so a straight drop never wins
    bars.push({ a: { x: spout.x - 40, y: 120 + r() * 40 }, b: { x: spout.x + 40, y: 120 + r() * 40 } });
    const stars = [];
    for (let tries = 0; stars.length < 3 && tries < 300; tries++) {
      const s = { x: 40 + r() * 280, y: 90 + r() * 320, got: false };
      if (bars.some(b => segDist(s, b.a, b.b) < 26)) continue;
      if (stars.some(o => Math.hypot(o.x - s.x, o.y - s.y) < 70)) continue;
      if (Math.hypot(s.x - cup.x, s.y - cup.y) < 70) continue;
      stars.push(s);
    }
    return { spout, cup, bars, stars };
  }
  function segDist(p, a, b) { const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l)); return Math.hypot(p.x - a.x - dx * t, p.y - a.y - dy * t); }

  // --- state ---
  let mode, level, strokes = [], drawing = null, ink = 0, state = 'edit', ball = null, drops = 0, tune = [], runT = 0, still = 0, result = null, sparks = [];
  let stats = load('pl-stats', { played: 0, streak: 0, stars: 0, lastDay: null });

  function begin(m) {
    mode = m; strokes = []; ink = 0; drops = 0; state = 'edit'; ball = null; result = null;
    level = makeLevel(m === 'daily' ? dayNum * 7727 + 3 : Math.floor(Math.random() * 1e9));
    $('meta').innerHTML = m === 'daily' ? `#${dayNum}<br>${today.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : 'Practice<br>not counted';
    $('done').hidden = true; $('tray').hidden = false;
    say('Draw ramps with your finger. Then drop the marble.');
    updateInk();
  }
  const say = t => $('msg').textContent = t;
  function updateInk() { const left = Math.max(0, 1 - ink / INK_MAX); $('inkbar').style.width = left * 100 + '%'; $('inkpct').textContent = Math.round(left * 100) + '%'; $('undo').disabled = !strokes.length || state !== 'edit'; $('clear').disabled = !strokes.length || state !== 'edit'; }

  // --- drawing ---
  let scale = 1, DPR = 1;
  function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); const w = $('box').getBoundingClientRect().width; scale = w / WW; cv.width = Math.round(w * DPR); cv.height = Math.round(w * 4 / 3 * DPR); }
  addEventListener('resize', resize);
  const toWorld = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; };
  cv.addEventListener('pointerdown', e => {
    initAudio();
    if (state !== 'edit') return;
    if (ink >= INK_MAX) { say('Out of chalk. Undo or wipe a line.'); return; }
    cv.setPointerCapture(e.pointerId);
    drawing = [toWorld(e)];
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = toWorld(e), last = drawing[drawing.length - 1], d = Math.hypot(p.x - last.x, p.y - last.y);
    if (d < 7) return;
    if (ink + d > INK_MAX) { endStroke(); say('Out of chalk.'); return; }
    ink += d; drawing.push(p); updateInk();
    if (Math.random() < .3) scratch();
  });
  function endStroke() { if (drawing && drawing.length > 1) strokes.push({ pts: drawing, len: drawing.reduce((a, p, i) => i ? a + Math.hypot(p.x - drawing[i - 1].x, p.y - drawing[i - 1].y) : 0, 0) }); drawing = null; updateInk(); }
  cv.addEventListener('pointerup', endStroke); cv.addEventListener('pointercancel', endStroke);
  $('undo').addEventListener('click', () => { const s = strokes.pop(); if (s) ink -= s.len; updateInk(); });
  $('clear').addEventListener('click', () => { strokes = []; ink = 0; updateInk(); });

  // --- physics ---
  function segments() {
    const segs = [];
    for (const b of level.bars) segs.push({ a: b.a, b: b.b, pad: 4, kind: 'bar' });
    for (const s of strokes) for (let i = 1; i < s.pts.length; i++) segs.push({ a: s.pts[i - 1], b: s.pts[i], pad: 2, kind: 'chalk' });
    const c = level.cup;
    segs.push({ a: { x: c.x - c.w / 2, y: c.y - c.h }, b: { x: c.x - c.w / 2, y: c.y }, pad: 3, kind: 'cup' });
    segs.push({ a: { x: c.x + c.w / 2, y: c.y - c.h }, b: { x: c.x + c.w / 2, y: c.y }, pad: 3, kind: 'cup' });
    segs.push({ a: { x: c.x - c.w / 2, y: c.y }, b: { x: c.x + c.w / 2, y: c.y }, pad: 3, kind: 'cup' });
    return segs;
  }
  let segCache = null;
  $('drop').addEventListener('click', () => {
    initAudio();
    if (state === 'edit') {
      state = 'run'; drops++; tune = []; runT = 0; still = 0; level.stars.forEach(s => s.got = false);
      ball = { x: level.spout.x, y: level.spout.y + 14, vx: 0, vy: 0, lastNote: -1 };
      segCache = segments(); $('drop').textContent = 'Stop'; updateInk(); say('…');
    } else if (state === 'run') fail('Stopped. Adjust and try again.');
  });
  function fail(text) { state = 'edit'; ball = null; $('drop').textContent = 'Drop it ♪'; say(text); updateInk(); level.stars.forEach(s => s.got = false); }

  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
  const NAMES = ['C', 'D', 'E', 'G', 'A', 'c', 'd', 'e', 'g', 'a', "c'", "d'"];
  function step(dt) {
    runT += dt;
    const sub = 10, h = dt / sub;
    for (let k = 0; k < sub; k++) {
      ball.vy += G * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < BALL) { ball.x = BALL; ball.vx = Math.abs(ball.vx) * .5; }
      if (ball.x > WW - BALL) { ball.x = WW - BALL; ball.vx = -Math.abs(ball.vx) * .5; }
      for (const s of segCache) {
        const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y, l = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((ball.x - s.a.x) * dx + (ball.y - s.a.y) * dy) / l));
        const px = s.a.x + dx * t, py = s.a.y + dy * t, ox = ball.x - px, oy = ball.y - py, d = Math.hypot(ox, oy), min = BALL + s.pad;
        if (d >= min || d === 0) continue;
        const nx = ox / d, ny = oy / d; ball.x = px + nx * min; ball.y = py + ny * min;
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          const bounce = s.kind === 'chalk' ? .35 : .55;
          ball.vx -= (1 + bounce) * vn * nx; ball.vy -= (1 + bounce) * vn * ny;
          ball.vx *= .995; ball.vy *= .995;
          if (-vn > 60) note(-vn);
        }
      }
    }
    for (const s of level.stars) if (!s.got && Math.hypot(s.x - ball.x, s.y - ball.y) < 18) { s.got = true; sparkle(s.x, s.y); chimeStar(); }
    const c = level.cup;
    if (Math.abs(ball.x - c.x) < c.w / 2 && ball.y > c.y - c.h + 4 && ball.y < c.y + 2) return win();
    if (ball.y > WH + 30) return fail('Missed. Shape your ramps and drop again.');
    const sp = Math.hypot(ball.vx, ball.vy);
    still = sp < 12 ? still + dt : 0;
    if (still > 1.2) return fail('The marble got stuck. Try a steeper ramp.');
    if (runT > 15) return fail('Took too long. Try a more direct path.');
  }

  function win() {
    state = 'won'; ball.y = level.cup.y - BALL - 3; ball.vx = ball.vy = 0;
    const got = level.stars.filter(s => s.got).length;
    const inkPct = Math.round(ink / INK_MAX * 100);
    result = { stars: got, drops, ink: inkPct, tune: tune.map(t => t.n) };
    for (let i = 0; i < 26; i++) sparkle(level.cup.x, level.cup.y - 20);
    [0, 4, 7, 12].forEach((s, i) => playNote(s + 12, .25, i * .1));
    try { navigator.vibrate && navigator.vibrate([20, 40, 20, 40, 80]); } catch (e) {}
    say(got === 3 ? 'All three stars. Beautiful.' : `In the cup${got ? ` with ${got} star${got > 1 ? 's' : ''}` : ''}.`);
    if (mode === 'daily') {
      const y = new Date(today); y.setDate(y.getDate() - 1);
      stats.streak = stats.lastDay === ymd(y) ? stats.streak + 1 : 1;
      stats.played++; stats.stars += got; stats.lastDay = dayKey;
      store('pl-stats', stats);
      store('pl-day', { key: dayKey, result, strokes: strokes.map(s => ({ pts: s.pts.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })), len: s.len })) });
    }
    setTimeout(showDone, 1200);
  }

  function showDone() {
    $('tray').hidden = true; $('done').hidden = false;
    $('doneLabel').textContent = mode === 'daily' ? `Plink #${dayNum}` : 'Practice board';
    $('stars').textContent = '★'.repeat(result.stars) + '☆'.repeat(3 - result.stars);
    $('summary').textContent = `${result.drops} drop${result.drops === 1 ? '' : 's'} · ${result.ink}% chalk used`;
    $('tune').textContent = result.tune.length ? '♪ ' + result.tune.slice(0, 16).map(n => NAMES[n]).join(' ') : 'A silent landing.';
    $('stats').innerHTML = `<div><b>${stats.played}</b><span>Played</span></div><div><b>${stats.streak}</b><span>Streak</span></div><div><b>${stats.stars}</b><span>Stars</span></div><div><b>${stats.played ? (stats.stars / stats.played).toFixed(1) : '–'}</b><span>Avg ★</span></div>`;
    $('practice').textContent = mode === 'daily' ? 'Practice board' : 'Another board';
  }

  // --- audio: every bounce is a note; position picks the pitch, impact the loudness ---
  let ac = null;
  function initAudio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); }
  function playNote(semi, vol, delay = 0) {
    if (!ac) return;
    const t = ac.currentTime + delay, f = 261.6 * Math.pow(2, semi / 12);
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2;
    g.gain.setValueAtTime(Math.min(.35, vol), t); g.gain.exponentialRampToValueAtTime(.001, t + 1.1);
    o.connect(g); o2.connect(g); g.connect(ac.destination); o.start(t); o2.start(t); o.stop(t + 1.2); o2.stop(t + 1.2);
  }
  function note(impact) {
    const idx = Math.max(0, Math.min(SCALE.length - 1, Math.floor(ball.x / WW * SCALE.length)));
    if (idx === ball.lastNote && runT - (ball.lastT || 0) < .08) return;
    ball.lastNote = idx; ball.lastT = runT;
    playNote(SCALE[idx], .08 + Math.min(.25, impact / 1500));
    tune.push({ n: idx, t: runT });
    sparks.push({ x: ball.x, y: ball.y, life: 1, text: '♪' });
    try { navigator.vibrate && navigator.vibrate(6); } catch (e) {}
  }
  function chimeStar() { [12, 16, 19].forEach((s, i) => playNote(s + 12, .15, i * .05)); }
  function scratch() {
    if (!ac) return;
    const len = Math.floor(ac.sampleRate * .03), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) * .25;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(); s.buffer = buf; f.type = 'highpass'; f.frequency.value = 3000;
    s.connect(f).connect(ac.destination); s.start();
  }
  function sparkle(x, y) { for (let i = 0; i < 8; i++) sparks.push({ x, y, vx: (Math.random() - .5) * 160, vy: (Math.random() - .5) * 160, life: .8 }); }
  $('replay').addEventListener('click', () => { initAudio(); const t = result && result.tune || []; t.slice(0, 24).forEach((n, i) => playNote(SCALE[n], .18, i * .16)); });

  // --- render ---
  function chalkLine(pts, color, width) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = pass ? .35 : .9;
      ctx.beginPath();
      pts.forEach((p, i) => { const jx = pass ? (Math.sin(p.x * 3.1 + p.y) * 1.2) : 0, jy = pass ? (Math.cos(p.y * 2.7 + p.x) * 1.2) : 0; i ? ctx.lineTo(p.x + jx, p.y + jy) : ctx.moveTo(p.x + jx, p.y + jy); });
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function draw(now) {
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
    ctx.fillStyle = '#1f3a30'; ctx.fillRect(0, 0, WW, WH);
    // chalk dust smudges
    ctx.fillStyle = 'rgba(241,239,230,.03)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse((i * 97) % WW, (i * 173) % WH, 90, 30, i, 0, 6.3); ctx.fill(); }
    if (!level) return;
    // scale hint along the bottom: low notes left, high notes right
    ctx.fillStyle = 'rgba(169,191,178,.35)'; ctx.font = '12px Gaegu, cursive'; ctx.textAlign = 'center';
    NAMES.forEach((n, i) => ctx.fillText(n, (i + .5) / NAMES.length * WW, WH - 6));
    // spout
    const sp = level.spout; ctx.fillStyle = '#c9b48a'; ctx.fillRect(sp.x - 12, 0, 24, sp.y - 6); ctx.fillRect(sp.x - 16, sp.y - 10, 32, 6);
    // bars (painted wood pegs)
    for (const b of level.bars) { ctx.strokeStyle = '#c98b54'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(b.a.x, b.a.y); ctx.lineTo(b.b.x, b.b.y); ctx.stroke(); ctx.strokeStyle = 'rgba(255,230,190,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.a.x, b.a.y - 2); ctx.lineTo(b.b.x, b.b.y - 2); ctx.stroke(); }
    // cup
    const c = level.cup; chalkLine([{ x: c.x - c.w / 2, y: c.y - c.h }, { x: c.x - c.w / 2, y: c.y }, { x: c.x + c.w / 2, y: c.y }, { x: c.x + c.w / 2, y: c.y - c.h }], '#ffe17a', 5);
    // stars
    for (const s of level.stars) if (!s.got) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.sin(now / 600 + s.x) * .2);
      ctx.fillStyle = '#ffe17a'; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? 4.5 : 10; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.fill(); ctx.restore();
    }
    // chalk ramps
    for (const s of strokes) chalkLine(s.pts, '#f1efe6', 4);
    if (drawing && drawing.length > 1) chalkLine(drawing, '#ff9fb8', 4);
    // marble
    const bx = ball ? ball.x : sp.x, by = ball ? ball.y : sp.y + 14;
    if (state !== 'edit' || !ball) {
      const g = ctx.createRadialGradient(bx - 3, by - 3, 1, bx, by, BALL);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.5, '#8fd3ff'); g.addColorStop(1, '#2a6f9a');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, BALL, 0, 6.3); ctx.fill();
    }
    // sparks and notes
    for (const p of sparks) {
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.text) { ctx.fillStyle = '#8fd3ff'; ctx.font = '16px Gaegu, cursive'; ctx.fillText(p.text, p.x + 10, p.y - 10 - (1 - p.life) * 20); }
      else { ctx.fillStyle = '#ffe17a'; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    if (state === 'run') step(dt);
    for (const p of sparks) { if (p.vx) { p.x += p.vx * dt; p.y += p.vy * dt; } p.life -= dt * 1.2; }
    sparks = sparks.filter(p => p.life > 0);
    draw(now);
    requestAnimationFrame(frame);
  }

  // --- share ---
  $('share').addEventListener('click', async () => {
    const head = mode === 'daily' ? `Plink #${dayNum} 🎶` : 'Plink (practice) 🎶';
    const text = `${head}\n${'⭐'.repeat(result.stars)}${'▫️'.repeat(3 - result.stars)} · ${result.drops} drop${result.drops === 1 ? '' : 's'} · ${result.ink}% chalk\n♪ ${result.tune.slice(0, 12).map(n => NAMES[n]).join(' ') || '(silence)'}${mode === 'daily' && stats.streak > 1 ? `\n🔥${stats.streak}` : ''}\n${location.href.split('#')[0]}`;
    if (navigator.share && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere.'); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); toast('Copied. Paste it anywhere.'); } catch (err) { toast('Could not copy on this browser.'); } ta.remove(); }
  });
  $('practice').addEventListener('click', () => begin('practice'));
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
  function tick() {
    const next = new Date(today); next.setDate(next.getDate() + 1);
    const s = Math.max(0, Math.floor((next - new Date()) / 1000));
    $('countdown').textContent = `New board in ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  setInterval(tick, 1000); tick();

  resize();
  const saved = load('pl-day', null);
  begin('daily');
  if (saved && saved.key === dayKey) {
    strokes = saved.strokes; result = saved.result; state = 'won'; ink = strokes.reduce((a, s) => a + s.len, 0);
    ball = { x: level.cup.x, y: level.cup.y - BALL - 3 }; say('Solved for today. Come back tomorrow.'); updateInk(); showDone();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
