<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16302b">
<title>Guess the Year</title>
<meta name="description" content="Five years. A few clues each. How close can you get? A new set every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one narrow column like a tear-off desk calendar: round dots, clue cards, a flip-digit year picker, then the result sheet. */
  :root {
    --bg: #f3ecdc;
    --card: #fffaf0;
    --ink: #1d1a14;
    --muted: #6d6556;
    --line: #ddd2bb;
    --accent: #c8402a;
    --pine: #16302b;
    --gold: #e0a526;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101a18; --card: #182523; --ink: #f1ead8; --muted: #9aa69f; --line: #2b3a37; --accent: #f06a4e; --pine: #0b1412; --gold: #f2bd45; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #101a18; --card: #182523; --ink: #f1ead8; --muted: #9aa69f; --line: #2b3a37; --accent: #f06a4e; --pine: #0b1412; --gold: #f2bd45; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
    padding-block: max(12px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 2.1rem; line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
  h1 em { font-style: normal; color: var(--accent); }
  .back { color: var(--muted); text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  .meta { text-align: right; font-family: var(--mono); font-size: .75rem; color: var(--muted); line-height: 1.4; }
  .dots { display: flex; gap: 8px; }
  .dot { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
  .dot.now { background: var(--ink); }
  .dot.r0 { background: #2f9e5b; } .dot.r1 { background: #6cbf4a; } .dot.r2 { background: var(--gold); } .dot.r3 { background: #e57a2e; } .dot.r4 { background: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 0 var(--line); }
  .label { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .clues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .clues li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 1.02rem; animation: drop .35s ease-out; }
  .clues li span { font-family: var(--display); font-weight: 900; font-size: 1.2rem; color: var(--accent); line-height: 1.3; }
  @keyframes drop { from { transform: translateY(-6px); opacity: .2; } }
  .more { align-self: flex-start; background: none; border: 1px dashed var(--muted); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 .85rem var(--body); cursor: pointer; }
  .more small { color: var(--muted); font-weight: 400; }
  .picker { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .step { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 1.6rem var(--body); cursor: pointer; flex: 0 0 auto; }
  .flip { display: flex; gap: 5px; }
  .flip b {
    display: grid; place-items: center; width: 50px; height: 74px; border-radius: 8px; background: var(--pine); color: #f6efdc;
    font-family: var(--display); font-weight: 900; font-size: 3.4rem; position: relative; font-variant-numeric: tabular-nums;
  }
  .flip b::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.45); }
  .flip b.tick { animation: tick .18s ease-out; }
  @keyframes tick { from { transform: rotateX(70deg); } }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .ends { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .go {
    width: 100%; border: 0; border-radius: 12px; padding: 16px; background: var(--accent); color: #fff8ee; cursor: pointer;
    font-family: var(--display); font-weight: 900; font-size: 1.5rem; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000);
  }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .go.alt { background: var(--pine); box-shadow: 0 4px 0 #000; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .reveal { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .reveal .big { font-family: var(--display); font-weight: 900; font-size: 4.2rem; line-height: 1; }
  .reveal .verdict { font-weight: 600; }
  .reveal .pts { font-family: var(--mono); color: var(--muted); font-size: .9rem; }
  .score { font-family: var(--display); font-weight: 900; font-size: 4.6rem; line-height: .9; text-align: center; }
  .score small { font-size: 1.6rem; color: var(--muted); }
  .grid { font-size: 1.9rem; text-align: center; letter-spacing: .1em; }
  .rows { display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
  .rows div { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .rows b { font-family: var(--mono); font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-family: var(--display); font-weight: 900; font-size: 1.8rem; line-height: 1; }
  .stats span { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .note { margin: 0; font-size: .82rem; color: var(--muted); text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .clues li, .flip b.tick { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1><a class="back" href="index.html" aria-label="Back to games">‹</a>Guess the <em>Year</em></h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="dots" id="dots" aria-hidden="true"></div>

  <!-- playing -->
  <section id="play" class="card" aria-live="polite">
    <div class="label" id="roundLabel">Round 1 of 5</div>
    <ul class="clues" id="clues"></ul>
    <button class="more" id="more" type="button"></button>
  </section>

  <section id="pickCard" class="card">
    <div class="picker">
      <button class="step" id="minus" type="button" aria-label="One year earlier">−</button>
      <div class="flip" id="flip" aria-live="polite"></div>
      <button class="step" id="plus" type="button" aria-label="One year later">+</button>
    </div>
    <input type="range" id="year" min="1970" max="2024" value="1997" aria-label="Year">
    <div class="ends"><span>1970</span><span>2024</span></div>
    <button class="go" id="lock" type="button">Lock it in</button>
  </section>

  <!-- after a guess -->
  <section id="revealCard" class="card reveal" hidden>
    <div class="label">It was</div>
    <div class="big" id="answer">1997</div>
    <div class="verdict" id="verdict"></div>
    <div class="pts" id="pts"></div>
    <button class="go alt" id="next" type="button">Next year</button>
  </section>

  <!-- results -->
  <section id="done" class="card" hidden>
    <div class="label" id="doneLabel">Today's score</div>
    <div class="score"><span id="total">0</span><small>/500</small></div>
    <div class="grid" id="grid"></div>
    <div class="rows" id="rows"></div>
    <button class="go" id="share" type="button">Share result</button>
    <div class="stats" id="stats"></div>
    <p class="note" id="countdown"></p>
    <button class="go alt" id="practice" type="button">Practice round</button>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MIN = 1970, MAX = 2024;

  // Clues go from hardest to giveaway. Written from well-documented events.
  const YEARS = {
    1970: ['The first Earth Day is held in the United States', 'Apollo 13 reports "Houston, we\'ve had a problem"', 'Paul McCartney announces the Beatles are done'],
    1971: ['Intel releases the 4004, the first commercial microprocessor', 'The first email between two computers is sent on ARPANET', 'Walt Disney World opens in Florida'],
    1972: ['Atari releases Pong in arcades', 'The "Blue Marble" photo of Earth is taken by Apollo 17', 'Munich hosts the Summer Olympics'],
    1973: ['The Sydney Opera House officially opens', 'Martin Cooper makes the first call from a handheld cell phone', 'An oil embargo sends fuel prices soaring'],
    1974: ['Ernő Rubik builds the first prototype of his cube', 'ABBA wins Eurovision with "Waterloo"', 'Richard Nixon resigns the US presidency'],
    1975: ['Microsoft is founded in Albuquerque', 'Jaws becomes the first summer blockbuster', 'Saigon falls and the Vietnam War ends'],
    1976: ['Concorde begins commercial passenger flights', 'Apple Computer is founded', 'The United States celebrates its Bicentennial'],
    1977: ['Voyager 1 and Voyager 2 launch toward the outer planets', 'The Apple II goes on sale', 'Elvis Presley dies at Graceland'],
    1978: ['Space Invaders hits arcades in Japan', 'Louise Brown, the first "test-tube baby", is born', 'The year of three popes ends with John Paul II'],
    1979: ['Sony launches the Walkman', 'Margaret Thatcher becomes UK prime minister', 'Revolution topples the Shah of Iran'],
    1980: ['CNN launches as the first 24-hour news channel', 'Pac-Man arrives in arcades', 'Mount St. Helens erupts in Washington State'],
    1981: ['IBM introduces its Personal Computer', 'MTV launches with "Video Killed the Radio Star"', 'Prince Charles marries Lady Diana Spencer'],
    1982: ['The Commodore 64 goes on sale', 'E.T. the Extra-Terrestrial is in theaters', 'Michael Jackson releases Thriller'],
    1983: ['Nintendo launches the Famicom in Japan', 'Sally Ride becomes the first American woman in space', 'Return of the Jedi completes the original Star Wars trilogy'],
    1984: ['Alexey Pajitnov creates Tetris in Moscow', 'Apple introduces the Macintosh', 'Los Angeles hosts the Summer Olympics'],
    1985: ['Microsoft releases Windows 1.0', 'Super Mario Bros. comes out', 'Live Aid concerts play in London and Philadelphia'],
    1986: ['Halley\'s Comet makes its closest pass of the century', 'Space Shuttle Challenger breaks apart after launch', 'The Chernobyl reactor explodes'],
    1987: ['The Simpsons first appear as shorts on The Tracey Ullman Show', 'Reagan says "Tear down this wall" in Berlin', 'Black Monday: stock markets crash worldwide'],
    1988: ['The Morris worm spreads across the early internet', 'Pan Am Flight 103 is bombed over Lockerbie', 'Seoul hosts the Summer Olympics'],
    1989: ['Tim Berners-Lee proposes what becomes the World Wide Web', 'Nintendo releases the Game Boy', 'The Berlin Wall falls'],
    1990: ['The Hubble Space Telescope is launched', 'East and West Germany reunify', 'Nelson Mandela walks free after 27 years in prison'],
    1991: ['The first website goes online at CERN', 'Nirvana releases Nevermind and Sonic the Hedgehog debuts', 'The Soviet Union dissolves'],
    1992: ['The first text message is sent: "Merry Christmas"', 'The US "Dream Team" plays basketball at the Barcelona Olympics', 'Bill Clinton is elected president'],
    1993: ['The Mosaic browser makes the web point-and-click', 'id Software releases Doom', 'Jurassic Park brings CGI dinosaurs to theaters'],
    1994: ['Amazon is founded as an online bookstore', 'The Channel Tunnel opens between England and France', 'Nelson Mandela becomes president of South Africa'],
    1995: ['eBay is founded', 'Toy Story is the first fully computer-animated feature film', 'Windows 95 launches with a Start button'],
    1996: ['Tamagotchi virtual pets go on sale in Japan', 'Dolly the sheep, the first cloned mammal, is born', 'The Nintendo 64 is released'],
    1997: ['IBM\'s Deep Blue beats Garry Kasparov at chess', 'The first Harry Potter book is published', 'Hong Kong is handed back to China'],
    1998: ['Apple releases the colorful iMac G3', 'France wins the World Cup on home soil', 'Google is founded in a garage'],
    1999: ['Napster launches and music sharing explodes', 'The euro is introduced for banking', 'Everyone worries about the Y2K bug'],
    2000: ['The first crew moves into the International Space Station', 'Sony launches the PlayStation 2', 'The dot-com bubble bursts'],
    2001: ['Microsoft launches the original Xbox', 'Wikipedia goes online', 'Apple introduces the first iPod'],
    2002: ['Sam Raimi\'s Spider-Man swings into theaters', 'Brazil wins its fifth World Cup, in Japan and South Korea', 'Euro coins and notes enter circulation'],
    2003: ['Skype launches', 'The Human Genome Project is declared complete', 'Concorde makes its final commercial flight'],
    2004: ['Gmail launches as an invite-only beta', 'An Indian Ocean tsunami strikes on Boxing Day', 'Facebook launches from a Harvard dorm room'],
    2005: ['Google Maps launches', 'Hurricane Katrina floods New Orleans', 'The first YouTube video, "Me at the zoo", is uploaded'],
    2006: ['Nintendo releases the Wii', 'Pluto is reclassified as a dwarf planet', 'Twitter launches'],
    2007: ['Amazon releases the first Kindle', 'The final Harry Potter book is published', 'Apple unveils the first iPhone'],
    2008: ['Apple opens the App Store', 'The Bitcoin whitepaper is published', 'Lehman Brothers collapses as a financial crisis hits'],
    2009: ['WhatsApp is founded', 'The Bitcoin network goes live', 'Michael Jackson dies'],
    2010: ['Instagram launches', 'Thirty-three trapped miners are rescued in Chile', 'Apple introduces the first iPad'],
    2011: ['Snapchat is founded', 'Minecraft gets its full 1.0 release', 'An earthquake and tsunami cause the Fukushima nuclear disaster'],
    2012: ['Scientists announce the discovery of the Higgs boson', 'The Curiosity rover lands on Mars', '"Gangnam Style" is the first video to reach a billion YouTube views'],
    2013: ['"Selfie" is named Oxford\'s Word of the Year', 'Pope Francis is elected', 'Edward Snowden leaks NSA documents'],
    2014: ['The Philae lander touches down on a comet', 'Germany beats host Brazil 7–1 in a World Cup semifinal', 'The Ice Bucket Challenge floods social media'],
    2015: ['New Horizons flies past Pluto', 'Nearly 200 countries sign the Paris climate agreement', 'The internet argues whether The Dress is blue and black or white and gold'],
    2016: ['Rio de Janeiro hosts the Summer Olympics', 'The UK votes to leave the European Union', 'Pokémon Go has everyone walking into lampposts'],
    2017: ['"Despacito" becomes the most-watched YouTube video', 'Nintendo launches the Switch', 'Fidget spinners are in every pocket'],
    2018: ['Prince Harry marries Meghan Markle', 'France wins the World Cup in Russia', 'A Thai youth football team is rescued from a flooded cave'],
    2019: ['Notre-Dame cathedral catches fire', 'Avengers: Endgame becomes the highest-grossing film yet', 'The first image of a black hole is released'],
    2020: ['Among Us suddenly becomes everyone\'s favorite game', 'The Tokyo Olympics are postponed', 'COVID-19 sends the world into lockdown'],
    2021: ['The James Webb Space Telescope launches on Christmas Day', 'The Ever Given container ship blocks the Suez Canal', 'The Tokyo Olympics are held a year late, without crowds'],
    2022: ['Queen Elizabeth II dies after 70 years on the throne', 'Argentina wins the World Cup in Qatar', 'OpenAI releases ChatGPT'],
    2023: ['India\'s Chandrayaan-3 lands near the Moon\'s south pole', 'King Charles III is crowned', '"Barbenheimer" takes over cinemas'],
    2024: ['Nvidia briefly becomes the world\'s most valuable company', 'A total solar eclipse crosses Mexico, the US and Canada', 'Paris hosts the Summer Olympics'],
  };
  const MAXPTS = [100, 75, 50];       // points available with 1, 2 or 3 clues showing
  const EMOJI = d => d === 0 ? '🎯' : d <= 2 ? '🟩' : d <= 5 ? '🟨' : d <= 9 ? '🟧' : '🟥';
  const BAND = d => d === 0 ? 0 : d <= 2 ? 1 : d <= 5 ? 2 : d <= 9 ? 3 : 4;
  const VERDICT = d => d === 0 ? 'Bullseye.' : d <= 2 ? 'So close.' : d <= 5 ? 'Not bad.' : d <= 9 ? 'Wrong decade-ish.' : 'Time traveler, you got lost.';

  // --- daily set: the same five years for everyone on the same local date ---
  const EPOCH = new Date(2026, 9, 31); // puzzle #1
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dayNum = Math.round((today - EPOCH) / 864e5) + 1;
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayKey = ymd(today);
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function pickSet(seed) {
    const r = rng(seed), all = Object.keys(YEARS).map(Number), set = [];
    for (let tries = 0; set.length < 5 && tries < 500; tries++) {
      const y = all[Math.floor(r() * all.length)];
      if (set.every(s => Math.abs(s - y) >= 4)) set.push(y);
    }
    return set;
  }

  // --- storage ---
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let stats = load('gty-stats', { played: 0, streak: 0, maxStreak: 0, best: 0, totalSum: 0, lastDay: null });

  let mode = 'daily', set, round, clueCount, results, guess = 1997;

  function start(m) {
    mode = m;
    set = m === 'daily' ? pickSet(dayNum * 7919) : pickSet(Math.floor(Math.random() * 1e9));
    round = 0; results = []; clueCount = 1;
    $('done').hidden = true; $('play').hidden = false; $('pickCard').hidden = false; $('revealCard').hidden = true;
    $('meta').innerHTML = m === 'daily' ? `#${dayNum}<br>${today.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : 'Practice<br>not counted';
    showRound();
  }

  function showRound() {
    const year = set[round];
    $('roundLabel').textContent = `Year ${round + 1} of 5`;
    const ul = $('clues'); ul.innerHTML = '';
    YEARS[year].slice(0, clueCount).forEach((c, i) => { const li = document.createElement('li'); const s = document.createElement('span'); s.textContent = i + 1; const t = document.createElement('div'); t.textContent = c; li.append(s, t); ul.append(li); });
    $('more').hidden = clueCount >= 3;
    $('more').innerHTML = `Show another clue <small>(max ${MAXPTS[clueCount]} pts)</small>`;
    $('lock').textContent = `Lock it in · ${MAXPTS[clueCount - 1]} pts max`;
    drawDots();
  }

  function drawDots() {
    const d = $('dots'); d.innerHTML = '';
    for (let i = 0; i < 5; i++) { const s = document.createElement('div'); s.className = 'dot' + (results[i] ? ' r' + BAND(results[i].diff) : i === round ? ' now' : ''); d.append(s); }
  }

  function setYear(y, animate = true) {
    y = Math.max(MIN, Math.min(MAX, y));
    const old = String(guess); guess = y; $('year').value = y;
    const f = $('flip'); if (!f.children.length) for (let i = 0; i < 4; i++) f.append(document.createElement('b'));
    String(y).split('').forEach((ch, i) => { const b = f.children[i]; if (b.textContent !== ch) { b.textContent = ch; if (animate && old[i] !== ch) { b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick'); } } });
  }
  $('year').addEventListener('input', e => setYear(+e.target.value));
  let hold;
  const stepper = (id, d) => {
    const el = $(id);
    const go = () => setYear(guess + d);
    el.addEventListener('pointerdown', () => { go(); hold = setTimeout(function rep() { go(); hold = setTimeout(rep, 70); }, 380); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => clearTimeout(hold)));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  };
  stepper('minus', -1); stepper('plus', 1);

  $('more').addEventListener('click', () => { if (clueCount < 3) { clueCount++; showRound(); } });

  $('lock').addEventListener('click', () => {
    const year = set[round], diff = Math.abs(guess - year);
    const pts = Math.round(MAXPTS[clueCount - 1] * Math.max(0, 1 - diff / 12));
    results.push({ year, guess, diff, pts, clues: clueCount });
    $('pickCard').hidden = true; $('revealCard').hidden = false;
    // show the remaining clues so you learn something either way
    clueCount = 3; showRound(); $('more').hidden = true;
    $('answer').textContent = year;
    $('verdict').textContent = `${EMOJI(diff)} ${VERDICT(diff)} You said ${guess}${diff ? `, off by ${diff}` : ''}.`;
    $('pts').textContent = `+${pts} points`;
    $('next').textContent = round === 4 ? 'See my score' : 'Next year';
    try { navigator.vibrate && navigator.vibrate(diff === 0 ? [30, 40, 30] : 15); } catch (e) {}
    drawDots();
    $('next').focus();
  });

  $('next').addEventListener('click', () => {
    round++;
    if (round >= 5) return finish();
    clueCount = 1; $('revealCard').hidden = true; $('pickCard').hidden = false; setYear(1997, false); showRound();
  });

  function finish() {
    const total = results.reduce((a, r) => a + r.pts, 0);
    if (mode === 'daily') {
      store('gty-day', { key: dayKey, num: dayNum, results });
      const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
      stats.streak = stats.lastDay === ymd(yesterday) ? stats.streak + 1 : 1;
      stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
      stats.played++; stats.totalSum += total; stats.best = Math.max(stats.best, total); stats.lastDay = dayKey;
      store('gty-stats', stats);
    }
    showDone(results, total);
  }

  function shareText(res) {
    const total = res.reduce((a, r) => a + r.pts, 0);
    const head = mode === 'daily' ? `Guess the Year #${dayNum} 🗓️` : 'Guess the Year (practice) 🗓️';
    const clues = res.reduce((a, r) => a + r.clues, 0);
    return `${head}\n${res.map(r => EMOJI(r.diff)).join('')}  ${total}/500\nOff by ${res.map(r => r.diff).join(' · ')}  ·  💡${clues}\n${location.href.split('#')[0]}`;
  }

  function showDone(res, total) {
    $('play').hidden = true; $('pickCard').hidden = true; $('revealCard').hidden = true; $('done').hidden = false;
    $('doneLabel').textContent = mode === 'daily' ? `Today's score · #${dayNum}` : 'Practice score';
    // count up the total for a little drama
    const el = $('total'); let n = 0; const step = Math.max(1, Math.round(total / 30));
    (function up() { n = Math.min(total, n + step); el.textContent = n; if (n < total) requestAnimationFrame(up); })();
    $('grid').textContent = res.map(r => EMOJI(r.diff)).join('');
    $('rows').innerHTML = '';
    res.forEach(r => {
      const d = document.createElement('div');
      d.innerHTML = `<span>${EMOJI(r.diff)}</span><span><b>${r.year}</b> · you said ${r.guess}</span><b>+${r.pts}</b>`;
      $('rows').append(d);
    });
    const avg = stats.played ? Math.round(stats.totalSum / stats.played) : 0;
    $('stats').innerHTML = `<div><b>${stats.played}</b><span>Played</span></div><div><b>${stats.streak}</b><span>Streak</span></div><div><b>${stats.best}</b><span>Best</span></div><div><b>${avg}</b><span>Average</span></div>`;
    $('practice').textContent = mode === 'daily' ? 'Practice round' : 'Another practice round';
    drawDots();
  }

  $('share').addEventListener('click', async () => {
    const res = results.length ? results : (load('gty-day', {}).results || []);
    const text = shareText(res);
    if (navigator.share && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere.'); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); toast('Copied. Paste it anywhere.'); } catch (err) { toast('Could not copy. Select the text manually.'); } ta.remove(); }
  });
  $('practice').addEventListener('click', () => start('practice'));

  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

  function tickCountdown() {
    const next = new Date(today); next.setDate(next.getDate() + 1);
    const s = Math.max(0, Math.floor((next - new Date()) / 1000));
    $('countdown').textContent = `New years in ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  setInterval(tickCountdown, 1000); tickCountdown();

  // keyboard: arrows nudge the year, Enter locks it in
  document.addEventListener('keydown', e => {
    if (!$('pickCard').hidden && document.activeElement !== $('year')) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setYear(guess - 1); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setYear(guess + 1); }
    }
  });

  setYear(1997, false);
  const done = load('gty-day', null);
  if (done && done.key === dayKey) { mode = 'daily'; set = done.results.map(r => r.year); results = done.results; round = 5; $('meta').innerHTML = `#${dayNum}<br>played`; showDone(done.results, done.results.reduce((a, r) => a + r.pts, 0)); }
  else start('daily');
})();
</script>
</body>
</html>
