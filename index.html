<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1714">
<title>Fizz Bomb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one full-screen canvas (the bottle) with a gauge strip on top and a single action button below. */
  :root {
    --night: #0d1714;
    --glass: #1f3a31;
    --cola: #3b1d0f;
    --fizz: #f3efe1;
    --label: #e8402c;
    --gauge-ok: #6fd08c;
    --gauge-hot: #ffb23e;
    --gauge-burst: #ff4b3e;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night); color: var(--fizz); font-family: var(--mono);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; padding-block: 12px 6px; gap: 12px; }
  h1 { font-family: var(--display); font-size: 1.4rem; margin: 0; letter-spacing: .02em; color: var(--label); }
  .stats { display: flex; gap: 14px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fizz); font-weight: 600; }
  .gauge { position: relative; height: 26px; border: 2px solid var(--glass); border-radius: 13px; overflow: hidden; background: #08100d; }
  .gauge-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gauge-ok); transition: background .2s; }
  .gauge-burst { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--gauge-burst); box-shadow: 0 0 8px var(--gauge-burst); }
  .gauge-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: .78rem; font-weight: 600; color: #08100d; mix-blend-mode: normal; font-variant-numeric: tabular-nums; }
  .gauge-text span { color: var(--fizz); text-shadow: 0 1px 2px #000; }
  .stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .msg {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 14px; padding: 24px; pointer-events: none;
  }
  .msg h2 { font-family: var(--display); font-size: clamp(2rem, 10vw, 3.4rem); margin: 0; line-height: 1; text-wrap: balance; text-shadow: 0 4px 0 #000; }
  .msg p { margin: 0; max-width: 32ch; line-height: 1.5; font-size: .95rem; text-shadow: 0 1px 3px #000; }
  .controls { padding-block: 10px 16px; display: flex; gap: 10px; }
  button {
    flex: 1; font-family: var(--display); font-size: 1.25rem; padding: 16px; border: 0; border-radius: 14px;
    background: var(--label); color: var(--fizz); box-shadow: 0 5px 0 #8f1f12; cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #8f1f12; }
  button:focus-visible { outline: 3px solid var(--fizz); outline-offset: 3px; }
  button.secondary { flex: 0 0 auto; background: var(--glass); box-shadow: 0 5px 0 #0a1712; font-size: 1rem; }
  .timer { font-family: var(--display); font-size: 2.2rem; position: absolute; top: 8px; right: 4px; opacity: .9; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>FIZZ BOMB</h1>
  <div class="stats"><span>Round <b id="round">1</b></span><span>Best <b id="best">0.0 m</b></span></div>
</header>
<div class="gauge" aria-label="Bottle pressure">
  <div class="gauge-fill" id="gfill"></div>
  <div class="gauge-burst" id="gburst"></div>
  <div class="gauge-text"><span id="psi">35 psi</span><span id="rating">PET rated ~? psi</span></div>
</div>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="timer" id="timer" hidden></div>
  <div class="msg" id="msg">
    <h2>SHAKE IT.</h2>
    <p>Shake your phone to build CO₂ pressure in the bottle, then open it for the tallest geyser you can get. Push past the bottle's limit and it bursts in your hand.</p>
    <p style="opacity:.7;font-size:.8rem">No motion sensor? Grab the bottle and shake it with your mouse or finger.</p>
  </div>
</div>
<div class="controls">
  <button id="btn">START</button>
  <button id="mute" class="secondary" aria-label="Toggle sound">🔊</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const btn = $('btn'), msg = $('msg'), timerEl = $('timer');

  // --- physical model (psi, seconds) ---
  const EQUILIBRIUM = 35;     // sealed soda at ~20°C
  const RELAX = 0.09;         // CO2 re-dissolving back toward equilibrium
  const SHAKE_GAIN = 0.42;    // psi per (m/s² of shake) per second
  const ROUND_TIME = 15;
  const GAUGE_MAX = 160;

  let state = 'intro';        // intro | shaking | spraying | burst | result
  let pressure = EQUILIBRIUM, burstAt = 130, timeLeft = ROUND_TIME;
  let round = 1, best = 0, lastHeight = 0;
  let shakeLevel = 0;         // smoothed shake intensity, m/s²
  let tiltX = 0;              // gravity x component for sloshing
  let jitter = { x: 0, y: 0 };
  let foam = 0, sprayTime = 0, exploded = false, openedAt = 0;
  let bubbles = [], particles = [], shards = [];
  let cap = null, flash = 0, creakCooldown = 0;
  let sound = true, motionSeen = false;

  try { best = parseFloat(localStorage.getItem('fizzbomb-best')) || 0; } catch (e) {}
  $('best').textContent = best.toFixed(1) + ' m';

  // --- canvas sizing ---
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const r = $('stage').getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // --- audio ---
  let ac = null, fizzGain = null, fizzFilter = null;
  function initAudio() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      fizzFilter = ac.createBiquadFilter(); fizzFilter.type = 'highpass'; fizzFilter.frequency.value = 3000;
      fizzGain = ac.createGain(); fizzGain.gain.value = 0;
      src.connect(fizzFilter).connect(fizzGain).connect(ac.destination); src.start();
    } catch (e) { ac = null; }
  }
  function setFizz(v) { if (fizzGain) fizzGain.gain.setTargetAtTime(sound ? v : 0, ac.currentTime, 0.05); }
  function boom(freq, dur, vol) {
    if (!ac || !sound) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(40, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // --- input: device motion ---
  let lastMag = 9.81;
  function onMotion(e) {
    const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
    motionSeen = true;
    const mag = Math.hypot(a.x, a.y, a.z);
    // jerk-ish: departure from 1g plus change since last sample
    const s = Math.min(45, Math.abs(mag - 9.81) + Math.abs(mag - lastMag) * 0.5);
    lastMag = mag;
    addShake(s);
    tiltX = tiltX * 0.85 + (a.x / 9.81) * 0.15;
  }
  function addShake(s) { shakeLevel = Math.max(shakeLevel, s); }

  async function enableMotion() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try { if (await DeviceMotionEvent.requestPermission() !== 'granted') return; } catch (e) { return; }
    }
    addEventListener('devicemotion', onMotion);
  }

  // --- input: pointer shaking fallback ---
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, t: performance.now() }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const now = performance.now(), dt = Math.max(8, now - drag.t);
    const v = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) / dt; // px/ms
    addShake(Math.min(40, v * 14));
    tiltX = Math.max(-1, Math.min(1, tiltX + (e.clientX - drag.x) * 0.004));
    drag = { x: e.clientX, y: e.clientY, t: now };
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });

  // --- game flow ---
  function startRound() {
    pressure = EQUILIBRIUM; timeLeft = ROUND_TIME; foam = 0; shakeLevel = 0;
    burstAt = 115 + Math.random() * 30;           // every bottle is a little different
    particles = []; shards = []; cap = null; exploded = false;
    $('rating').textContent = 'rated ~' + (Math.round(burstAt / 10) * 10) + ' psi';
    $('gburst').style.left = (burstAt / GAUGE_MAX * 100) + '%';
    $('round').textContent = round;
    msg.hidden = true; timerEl.hidden = false;
    btn.textContent = 'OPEN THE CAP';
    state = 'shaking';
  }

  function openCap() {
    state = 'spraying'; sprayTime = 0; openedAt = pressure; timerEl.hidden = true;
    lastHeight = Math.max(0, (pressure - EQUILIBRIUM) * 0.055); // metres of geyser
    cap = { x: 0, y: 0, vx: (Math.random() - .5) * 4, vy: -14 - lastHeight * 3, r: 0, vr: (Math.random() - .5) * .6 };
    boom(900, 0.18, 0.6); buzz([60, 40, 120]);
    btn.textContent = '…';
  }

  function burst() {
    state = 'burst'; exploded = true; timerEl.hidden = true; flash = 1; lastHeight = 0;
    const b = bottleGeom();
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 14;
      shards.push({ x: b.cx + (Math.random() - .5) * b.w, y: b.top + Math.random() * b.h, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
        r: Math.random() * 6, vr: (Math.random() - .5) * .5, s: 4 + Math.random() * 14 });
    }
    for (let i = 0; i < 260; i++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 16;
      particles.push({ x: b.cx, y: b.top + b.h * .6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, s: 2 + Math.random() * 5 });
    }
    boom(180, 0.7, 1); buzz([300, 80, 200]); setFizz(0.25);
    setTimeout(() => endRound(true), 1600);
  }

  function endRound(burstFlag) {
    state = 'result'; setFizz(0);
    const h = burstFlag ? 0 : lastHeight;
    let title, line;
    if (burstFlag) { title = 'KABOOM'; line = `The bottle gave out at ${Math.round(pressure)} psi. You're covered in cola. Score: 0 m.`; }
    else if (h < 0.5) { title = 'PFFT.'; line = `${Math.round(openedAt)} psi barely made it over the rim. Shake harder.`; }
    else { title = h.toFixed(1) + ' m'; line = `Opened at ${Math.round(openedAt)} psi. ` + (h > best ? 'New best geyser!' : `Best is ${best.toFixed(1)} m.`); }
    if (h > best) { best = h; try { localStorage.setItem('fizzbomb-best', best); } catch (e) {} $('best').textContent = best.toFixed(1) + ' m'; }
    msg.innerHTML = ''; const h2 = document.createElement('h2'); h2.textContent = title; const p = document.createElement('p'); p.textContent = line;
    msg.append(h2, p); msg.hidden = false;
    round++; btn.textContent = 'NEXT BOTTLE';
  }

  btn.addEventListener('click', async () => {
    initAudio(); if (ac && ac.state === 'suspended') ac.resume();
    if (state === 'intro') { await enableMotion(); startRound(); }
    else if (state === 'shaking') openCap();
    else if (state === 'result') startRound();
  });
  $('mute').addEventListener('click', () => { sound = !sound; $('mute').textContent = sound ? '🔊' : '🔇'; if (!sound) setFizz(0); });

  // --- bottle geometry (a 500 ml PET bottle) ---
  function bottleGeom() {
    const h = Math.min(H * 0.62, 420), w = h * 0.36;
    return { cx: W / 2 + jitter.x, top: H - h - 24 + jitter.y, h, w };
  }
  function bottlePath(b) {
    const { cx, top, h, w } = b, neckW = w * 0.34, neckH = h * 0.13, shoulder = h * 0.27, x0 = cx - w / 2, x1 = cx + w / 2;
    ctx.beginPath();
    ctx.moveTo(cx - neckW / 2, top);
    ctx.lineTo(cx - neckW / 2, top + neckH);
    ctx.bezierCurveTo(cx - neckW / 2, top + neckH + shoulder * .4, x0, top + shoulder * .7, x0, top + shoulder + neckH * .5);
    ctx.lineTo(x0, top + h * .52);
    ctx.quadraticCurveTo(x0 + w * .06, top + h * .56, x0, top + h * .6); // grip ridge
    ctx.lineTo(x0, top + h - w * .14);
    ctx.quadraticCurveTo(x0, top + h, x0 + w * .2, top + h);
    ctx.lineTo(x1 - w * .2, top + h);
    ctx.quadraticCurveTo(x1, top + h, x1, top + h - w * .14);
    ctx.lineTo(x1, top + h * .6);
    ctx.quadraticCurveTo(x1 - w * .06, top + h * .56, x1, top + h * .52);
    ctx.lineTo(x1, top + shoulder + neckH * .5);
    ctx.bezierCurveTo(x1, top + shoulder * .7, cx + neckW / 2, top + neckH + shoulder * .4, cx + neckW / 2, top + neckH);
    ctx.lineTo(cx + neckW / 2, top);
    ctx.closePath();
    return { neckW };
  }

  // --- simulation ---
  let last = performance.now(), t = 0;
  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;

    if (state === 'shaking') {
      timeLeft -= dt;
      pressure += shakeLevel * SHAKE_GAIN * dt - (pressure - EQUILIBRIUM) * RELAX * dt;
      foam = Math.min(1, foam + shakeLevel * 0.006 * dt * 10) * (1 - 0.25 * dt);
      const amp = Math.min(14, shakeLevel * 0.4);
      jitter.x = (Math.random() - .5) * amp; jitter.y = (Math.random() - .5) * amp * .6;
      setFizz(Math.min(0.12, shakeLevel * 0.003 + (pressure - EQUILIBRIUM) * 0.0006));
      if (fizzFilter) fizzFilter.frequency.value = 2500 + pressure * 20;
      if (pressure > burstAt * 0.82) {
        creakCooldown -= dt;
        if (creakCooldown <= 0) { buzz(30); boom(120 + Math.random() * 60, 0.12, 0.25); creakCooldown = 0.25 + Math.random() * 0.5 * (burstAt - pressure) / 20; }
      }
      if (pressure >= burstAt) burst();
      else if (timeLeft <= 0) openCap();
      timerEl.textContent = Math.max(0, Math.ceil(timeLeft));
      // bubbles spawn with pressure
      if (Math.random() < 0.2 + shakeLevel * 0.06) spawnBubble();
    } else {
      jitter.x *= 0.8; jitter.y *= 0.8;
    }
    shakeLevel *= Math.pow(0.02, dt);  // decay fast so only continuous shaking counts
    if (!motionSeen && !drag) tiltX *= Math.pow(0.1, dt);

    if (state === 'spraying') {
      sprayTime += dt;
      const strength = Math.max(0, 1 - sprayTime / (1.2 + lastHeight * 0.35));
      pressure = 14.7 + (pressure - 14.7) * Math.pow(0.25, dt); // venting to atmosphere
      setFizz(0.25 * strength);
      const b = bottleGeom();
      const n = Math.floor(30 * strength);
      const vTop = Math.sqrt(2 * 0.55 * Math.max(0.05, lastHeight) * rulerScale()); // reach the ruler mark for lastHeight
      for (let i = 0; i < n; i++) particles.push({ x: b.cx + (Math.random() - .5) * 6, y: b.top, vx: (Math.random() - .5) * 2.4 + tiltX * 3,
        vy: -vTop * strength * (0.75 + Math.random() * 0.35), life: 1, s: 2 + Math.random() * 4, foam: Math.random() < 0.4 });
      if (strength <= 0 && particles.length < 20) endRound(false);
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.55; p.vx *= 0.99; p.life -= dt * 0.6; }
    particles = particles.filter(p => p.life > 0 && p.y < H + 20);
    for (const s of shards) { s.x += s.vx; s.y += s.vy; s.vy += 0.6; s.r += s.vr; }
    shards = shards.filter(s => s.y < H + 40);
    if (cap) { cap.x += cap.vx; cap.y += cap.vy; cap.vy += 0.6; cap.r += cap.vr; }
    for (const bb of bubbles) { bb.y -= bb.v * (1 + shakeLevel * 0.08); bb.x += Math.sin(t * 6 + bb.ph) * 0.3; }
    bubbles = bubbles.filter(bb => bb.y > bb.stop);
    flash *= Math.pow(0.02, dt);

    updateGauge();
    draw();
    requestAnimationFrame(step);
  }

  function spawnBubble() {
    const b = bottleGeom();
    bubbles.push({ rx: (Math.random() - .5) * b.w * 0.8, y: b.top + b.h - 6, x: 0, v: 0.8 + Math.random() * 2, r: 1 + Math.random() * 2.5, ph: Math.random() * 6, stop: b.top + b.h * 0.25 });
  }

  function updateGauge() {
    const p = Math.max(0, pressure);
    $('psi').textContent = Math.round(p) + ' psi';
    const f = $('gfill'); f.style.width = Math.min(100, p / GAUGE_MAX * 100) + '%';
    f.style.background = p > burstAt * 0.82 ? 'var(--gauge-burst)' : p > burstAt * 0.6 ? 'var(--gauge-hot)' : 'var(--gauge-ok)';
  }

  // --- rendering ---
  function draw() {
    ctx.clearRect(0, 0, W, H);
    // backdrop: kitchen counter + height ruler
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#13231e'); g.addColorStop(1, '#0a1210');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a2924'; ctx.fillRect(0, H - 24, W, 24);
    drawRuler();

    const b = bottleGeom();
    const visible = !exploded;

    if (visible) {
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.beginPath(); ctx.ellipse(b.cx, H - 22, b.w * .6, 7, 0, 0, Math.PI * 2); ctx.fill();

      ctx.save();
      // bulge under pressure
      const bulge = 1 + Math.max(0, pressure - EQUILIBRIUM) / burstAt * 0.06;
      ctx.translate(b.cx, b.top + b.h); ctx.scale(bulge, 1); ctx.translate(-b.cx, -(b.top + b.h));
      const { neckW } = bottlePath(b);
      ctx.save(); ctx.clip();

      // liquid with tilted, sloshing surface
      const fill = state === 'spraying' || state === 'result' ? 0.55 : 0.8;
      const surfY = b.top + b.h * (1 - fill);
      const slope = tiltX * b.w * 0.35;
      const wave = Math.sin(t * 9) * shakeLevel * 0.5;
      ctx.beginPath();
      ctx.moveTo(b.cx - b.w, surfY + slope + wave);
      for (let i = 0; i <= 20; i++) {
        const x = b.cx - b.w + (i / 20) * b.w * 2;
        ctx.lineTo(x, surfY + slope * (1 - i / 10) + Math.sin(t * 7 + i) * (1.5 + shakeLevel * 0.25));
      }
      ctx.lineTo(b.cx + b.w, b.top + b.h + 5); ctx.lineTo(b.cx - b.w, b.top + b.h + 5); ctx.closePath();
      const lg = ctx.createLinearGradient(b.cx - b.w / 2, 0, b.cx + b.w / 2, 0);
      lg.addColorStop(0, '#22100a'); lg.addColorStop(.45, '#5a2c14'); lg.addColorStop(1, '#1a0b06');
      ctx.fillStyle = lg; ctx.fill();

      // foam head grows as you shake
      const foamH = foam * b.h * 0.35 + (pressure - EQUILIBRIUM) * 0.25;
      if (foamH > 1) {
        ctx.fillStyle = 'rgba(214,180,140,.85)';
        ctx.beginPath();
        for (let i = 0; i <= 24; i++) {
          const x = b.cx - b.w + (i / 24) * b.w * 2;
          const y = surfY + slope * (1 - i / 12) - foamH + Math.sin(i * 1.7 + t * 5) * 3;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.lineTo(b.cx + b.w, surfY + slope * -1 + 4); ctx.lineTo(b.cx - b.w, surfY + slope + 4); ctx.closePath(); ctx.fill();
      }

      // bubbles
      ctx.strokeStyle = 'rgba(255,240,220,.55)'; ctx.lineWidth = 1;
      for (const bb of bubbles) { ctx.beginPath(); ctx.arc(b.cx + bb.rx + bb.x, bb.y, bb.r, 0, Math.PI * 2); ctx.stroke(); }

      ctx.restore();

      // glass/plastic shell
      bottlePath(b);
      ctx.strokeStyle = 'rgba(200,235,220,.55)'; ctx.lineWidth = 2; ctx.stroke();
      const sh = ctx.createLinearGradient(b.cx - b.w / 2, 0, b.cx + b.w / 2, 0);
      sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.18, 'rgba(255,255,255,.22)'); sh.addColorStop(.26, 'rgba(255,255,255,0)');
      sh.addColorStop(.85, 'rgba(255,255,255,.06)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sh; ctx.fill();

      // label
      const ly = b.top + b.h * 0.42, lh = b.h * 0.16;
      ctx.fillStyle = '#e8402c'; ctx.fillRect(b.cx - b.w / 2, ly, b.w, lh);
      ctx.fillStyle = '#f3efe1'; ctx.font = `${Math.round(lh * 0.42)}px Bungee, Impact, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('FIZZ', b.cx, ly + lh * 0.45);
      ctx.font = `${Math.round(lh * 0.16)}px "IBM Plex Mono", monospace`; ctx.fillText('500 ml · CARBONATED', b.cx, ly + lh * 0.82);

      // neck ring + cap (if still on)
      ctx.fillStyle = 'rgba(200,235,220,.4)'; ctx.fillRect(b.cx - neckW * .65, b.top + b.h * 0.1, neckW * 1.3, 4);
      if (!cap) drawCap(b.cx, b.top, neckW, 0);
      ctx.restore();
    }

    if (cap) { const bb = bottleGeom(); drawCap(bb.cx + cap.x, bb.top + cap.y, bb.w * 0.34, cap.r); }

    // spray + droplets
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.foam ? '#e9dcc4' : '#7a3d1a';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // PET shards
    for (const s of shards) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.r);
      ctx.fillStyle = 'rgba(200,235,220,.45)'; ctx.strokeStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.moveTo(-s.s / 2, -s.s / 3); ctx.lineTo(s.s / 2, -s.s / 4); ctx.lineTo(0, s.s / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    if (flash > 0.01) { ctx.fillStyle = `rgba(255,240,220,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }

    // spray height marker
    if (state === 'spraying' && particles.length) {
      ctx.fillStyle = '#f3efe1'; ctx.font = '600 13px "IBM Plex Mono", monospace'; ctx.textAlign = 'left';
      ctx.fillText(`▲ ${lastHeight.toFixed(1)} m`, 8, 18);
    }
    if (state === 'shaking' && shakeLevel < 2 && pressure < EQUILIBRIUM + 3 && Math.floor(t * 2) % 2) {
      ctx.fillStyle = 'rgba(243,239,225,.8)'; ctx.font = '22px Bungee, Impact, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('SHAKE!', W / 2, 40);
    }
  }

  function rulerScale() { return Math.max(20, bottleGeom().top - 20) / 6; } // px per metre; 6 m fits above the bottle

  function drawRuler() {
    // the geyser is drawn to a 6 m scale over the stage; mark where the last one peaked
    const base = bottleGeom().top, scale = rulerScale();
    if (state === 'result' && lastHeight > 0) {
      const y = base - Math.min(6, lastHeight) * scale;
      ctx.strokeStyle = '#ffb23e'; ctx.lineWidth = 1; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ffb23e'; ctx.font = '600 12px "IBM Plex Mono", monospace'; ctx.textAlign = 'right'; ctx.fillText(lastHeight.toFixed(1) + ' m', W - 4, y - 6);
    }
  }

  function drawCap(x, y, neckW, r) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(r);
    const cw = neckW * 1.25, ch = neckW * 0.55;
    ctx.fillStyle = '#c92b1b'; ctx.fillRect(-cw / 2, -ch, cw, ch);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    for (let i = 1; i < 9; i++) ctx.fillRect(-cw / 2 + (cw / 9) * i, -ch, 1.2, ch);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-cw / 2, -ch, cw, 3);
    ctx.restore();
  }

  requestAnimationFrame(step);
})();
</script>
</body>
</html>
