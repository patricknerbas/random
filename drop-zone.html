<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a1a">
<title>Drop Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: score strip on top, a tall endless shaft canvas, one big action button below. */
  :root {
    --void: #0b0a1a;
    --shaft: #15132e;
    --bar: #4d47a8;
    --hot: #ff5a36;
    --gem: #3ff2c4;
    --ink: #f1eefc;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void); color: var(--ink); font-family: var(--mono);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; padding-block: 12px 8px; gap: 12px; }
  h1 { font-family: var(--display); font-size: 1.4rem; margin: 0; color: var(--hot); white-space: nowrap; }
  .back { color: var(--ink); text-decoration: none; margin-right: 10px; opacity: .7; }
  .stats { display: flex; gap: 12px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .stats b { font-weight: 600; }
  .stats .g b { color: var(--gem); }
  .stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 10px; }
  .msg {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 12px; padding: 24px; pointer-events: none; background: rgba(11, 10, 26, .72); border-radius: 10px;
  }
  .msg h2 { font-family: var(--display); font-size: clamp(2.4rem, 13vw, 4rem); margin: 0; line-height: 1; color: var(--ink); text-shadow: 0 4px 0 #000; font-variant-numeric: tabular-nums; }
  .msg .tag { font-family: var(--display); color: var(--hot); font-size: 1rem; letter-spacing: .05em; }
  .msg p { margin: 0; max-width: 32ch; line-height: 1.5; font-size: .92rem; }
  .progress { width: min(260px, 80%); display: flex; flex-direction: column; gap: 6px; font-size: .75rem; }
  .bar { height: 10px; border-radius: 5px; background: var(--shaft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gem); }
  .controls { padding-block: 10px 16px; display: flex; gap: 10px; }
  button {
    flex: 1; font-family: var(--display); font-size: 1.25rem; padding: 16px; border: 0; border-radius: 14px;
    background: var(--hot); color: var(--void); box-shadow: 0 5px 0 #a12a12; cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #a12a12; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button.secondary { flex: 0 0 auto; background: var(--shaft); color: var(--ink); box-shadow: 0 5px 0 #05040e; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1><a class="back" href="index.html" aria-label="Back to games">‹</a>DROP ZONE</h1>
  <div class="stats"><span>Best <b id="best">0</b></span><span class="g">Gems <b id="gems">0</b></span></div>
</header>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="msg" id="msg">
    <h2>DROP.</h2>
    <p>Tilt to steer the ball down through the gaps. The floors keep rising. Touch the spikes at the top or a red floor and it's over.</p>
    <p style="opacity:.75;font-size:.8rem">Fall through several gaps without landing to stack your multiplier. Grab gems to unlock new balls.</p>
  </div>
</div>
<div class="controls">
  <button id="btn">PLAY</button>
  <button id="skinBtn" class="secondary" aria-label="Change ball">BALL</button>
  <button id="mute" class="secondary" aria-label="Toggle sound">🔊</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const btn = $('btn'), msg = $('msg');

  const SKINS = [
    { name: 'Steel', need: 0, core: '#e8ebf0', edge: '#5f6670', trail: '#9aa3b0' },
    { name: 'Ember', need: 25, core: '#ffe08a', edge: '#e2451b', trail: '#ff7a3d' },
    { name: 'Mint', need: 60, core: '#e9fff8', edge: '#16a884', trail: '#3ff2c4' },
    { name: 'Plasma', need: 120, core: '#ffd9fb', edge: '#8a2be2', trail: '#e14cff' },
    { name: 'Gold', need: 200, core: '#fff6c8', edge: '#b8860b', trail: '#ffd23f' },
    { name: 'Void', need: 350, core: '#2b2b3a', edge: '#000000', trail: '#ffffff' },
  ];

  // --- saved progress ---
  let save = { best: 0, gems: 0, skin: 0, runs: 0 };
  try { save = { ...save, ...JSON.parse(localStorage.getItem('dropzone') || '{}') }; } catch (e) {}
  const persist = () => { try { localStorage.setItem('dropzone', JSON.stringify(save)); } catch (e) {} };
  const unlocked = () => SKINS.filter(s => save.gems >= s.need);
  function refreshHud() { $('best').textContent = save.best; $('gems').textContent = save.gems; $('skinBtn').textContent = SKINS[save.skin].name.toUpperCase(); }
  refreshHud();

  // --- canvas ---
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const r = $('stage').getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // --- input ---
  let sensor = null, base = null, keyX = 0, drag = null, tilt = 0;
  function onOrient(e) {
    if (e.gamma == null) return;
    const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let gx = e.gamma; if (angle === 90) gx = e.beta; else if (angle === -90 || angle === 270) gx = -e.beta;
    sensor = gx * Math.PI / 180; if (base == null) base = sensor;
  }
  async function enableSensor() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { if (await DeviceOrientationEvent.requestPermission() !== 'granted') return; } catch (e) { return; }
    }
    addEventListener('deviceorientation', onOrient);
  }
  cv.addEventListener('pointerdown', e => { drag = e; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (drag) drag = e; });
  cv.addEventListener('pointerup', () => drag = null); cv.addEventListener('pointercancel', () => drag = null);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keyX = -0.35; if (e.key === 'ArrowRight') keyX = 0.35;
    if (e.code === 'Space' && state !== 'playing') { e.preventDefault(); btn.click(); }
  });
  addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keyX = 0; });
  function readTilt() {
    let x = sensor != null && base != null ? sensor - base : 0;
    if (drag) { const r = cv.getBoundingClientRect(); x = ((drag.clientX - r.left) / r.width - .5) * 1.1; }
    x += keyX;
    tilt += (Math.max(-0.6, Math.min(0.6, x)) - tilt) * 0.5;
  }

  // --- audio ---
  let ac = null, sound = true;
  function initAudio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  function tone(freq, dur, type = 'sine', vol = 0.25, slide = 1) {
    if (!ac || !sound) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24]; // pentatonic climb for the streak
  const note = n => 330 * Math.pow(2, SCALE[Math.min(n, SCALE.length - 1)] / 12);
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // --- game state ---
  let state = 'intro', score = 0, streak = 0, bestStreak = 0, runGems = 0, newBest = false;
  let ball, rows, speed, nextRowY, rowGap, shake = 0, time = 0;
  let particles = [], popups = [], trail = [];
  const R = () => Math.max(8, W * 0.035);
  const BAR_H = () => R() * 0.9;
  const SPIKE_H = 14;

  function newRun() {
    const r = R();
    ball = { x: W / 2, y: H * 0.3, vx: 0, vy: 0, r, grounded: false };
    rows = []; particles = []; popups = []; trail = [];
    score = 0; streak = 0; bestStreak = 0; runGems = 0; newBest = false; time = 0;
    speed = H * 0.11; rowGap = Math.max(r * 6, H * 0.2);
    nextRowY = H * 0.55;
    while (nextRowY < H + rowGap) spawnRow();
    base = sensor; // re-level to however the phone is held right now
  }

  function spawnRow() {
    const r = R(), difficulty = Math.min(1, score / 120);
    const gapW = r * (4.4 - difficulty * 1.6) * (0.9 + Math.random() * 0.25);
    const gaps = [];
    const g1 = r + Math.random() * (W - gapW - 2 * r);
    gaps.push([g1, g1 + gapW]);
    if (Math.random() < 0.3 - difficulty * 0.2) { // occasional second gap
      const g2 = r + Math.random() * (W - gapW - 2 * r);
      if (Math.abs(g2 - g1) > gapW * 2) gaps.push([g2, g2 + gapW]);
    }
    gaps.sort((a, b) => a[0] - b[0]);
    const segs = []; let x = 0;
    for (const [a, b] of gaps) { if (a > x) segs.push([x, a]); x = b; }
    if (x < W) segs.push([x, W]);
    const spike = score > 15 && Math.random() < 0.08 + difficulty * 0.18;
    // a moving row later on
    const moving = score > 30 && !spike && Math.random() < 0.15 + difficulty * 0.2 ? (Math.random() < .5 ? -1 : 1) * r * (2 + difficulty * 3) : 0;
    const row = { y: nextRowY, segs, gaps, spike, moving, shift: 0, passed: false,
      minShift: r - gaps[0][0], maxShift: W - r - gaps[gaps.length - 1][1] };
    if (Math.random() < 0.45) { const [a, b] = gaps[0]; row.gem = { x: (a + b) / 2, dy: -r * 1.6, taken: false }; }
    rows.push(row);
    nextRowY += rowGap * (0.85 + Math.random() * 0.3);
  }

  function segRects(row) {
    const h = BAR_H();
    // moving rows slide their gaps; the outer segments stay pinned to the walls
    return row.segs.map(([a, b]) => {
      const x1 = a === 0 ? 0 : a + row.shift, x2 = b >= W ? W : b + row.shift;
      return { x: x1, y: row.y, w: Math.max(0, x2 - x1), h };
    });
  }

  function die() {
    state = 'dead'; shake = 1; buzz([120, 60, 200]); tone(220, 0.5, 'sawtooth', 0.3, 0.3);
    for (let i = 0; i < 40; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 260; particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: SKINS[save.skin].trail }); }
    save.runs++;
    if (score > save.best) { save.best = score; newBest = true; }
    save.gems += runGems; persist(); refreshHud();
    setTimeout(showResult, 700);
  }

  function showResult() {
    msg.innerHTML = '';
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = newBest ? 'NEW BEST!' : `BEST ${save.best}`;
    const h = document.createElement('h2'); h.textContent = score;
    const p = document.createElement('p'); p.textContent = `Longest streak ×${bestStreak} · +${runGems} gem${runGems === 1 ? '' : 's'}`;
    msg.append(tag, h, p);
    const next = SKINS.find(s => s.need > save.gems);
    const prog = document.createElement('div'); prog.className = 'progress';
    if (next) {
      const prev = [...SKINS].reverse().find(s => s.need <= save.gems);
      const pct = (save.gems - prev.need) / (next.need - prev.need) * 100;
      prog.innerHTML = `<span>${next.need - save.gems} gems to unlock <b>${next.name}</b></span><div class="bar"><i style="width:${pct}%"></i></div>`;
    } else prog.innerHTML = '<span>Every ball unlocked. Now chase that best.</span>';
    msg.append(prog);
    const fresh = SKINS.filter(s => s.need <= save.gems && s.need > save.gems - runGems && s.need > 0);
    if (fresh.length) { const u = document.createElement('p'); u.style.color = 'var(--gem)'; u.textContent = `Unlocked ${fresh.map(s => s.name).join(', ')}! Tap BALL to equip.`; msg.append(u); }
    msg.hidden = false; btn.textContent = 'AGAIN';
  }

  btn.addEventListener('click', async () => {
    initAudio(); if (ac && ac.state === 'suspended') ac.resume();
    if (state === 'intro') await enableSensor();
    newRun(); msg.hidden = true; state = 'playing'; btn.textContent = 'DROPPING…';
    tone(660, 0.12, 'triangle', 0.2, 1.5);
  });
  $('skinBtn').addEventListener('click', () => {
    const list = unlocked(); const i = list.indexOf(SKINS[save.skin]);
    save.skin = SKINS.indexOf(list[(i + 1) % list.length]); persist(); refreshHud();
    tone(880, 0.08, 'triangle', 0.15);
  });
  $('mute').addEventListener('click', () => { sound = !sound; $('mute').textContent = sound ? '🔊' : '🔇'; });

  // --- simulation ---
  function update(dt) {
    time += dt;
    speed = H * (0.11 + Math.min(0.17, score * 0.0014));
    const r = ball.r;

    for (const row of rows) {
      row.y -= speed * dt;
      if (row.moving) { // slide the gaps back and forth, staying inside the shaft
        row.shift += row.moving * dt;
        if (row.shift < row.minShift) { row.shift = row.minShift; row.moving = Math.abs(row.moving); }
        if (row.shift > row.maxShift) { row.shift = row.maxShift; row.moving = -Math.abs(row.moving); }
      }
    }
    while (rows.length && rows[0].y < -40) rows.shift();
    nextRowY -= speed * dt;
    while (nextRowY < H + rowGap) spawnRow();

    // steering: sideways accel from tilt, like a ball on a tilted plane
    ball.vx += Math.sin(tilt) * W * 6 * dt;
    ball.vx *= Math.exp(-(ball.grounded ? 2.5 : 1.2) * dt);
    ball.vy += H * 2.4 * dt;
    ball.vy = Math.min(ball.vy, H * 1.4);
    const wasGrounded = ball.grounded; ball.grounded = false;

    const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (r * 0.4)));
    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx * dt / steps; ball.y += ball.vy * dt / steps;
      if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * 0.4; }
      if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * 0.4; }
      if (ball.y > H - r) { ball.y = H - r; ball.vy = 0; ball.grounded = true; }
      for (const row of rows) {
        if (Math.abs(row.y - ball.y) > r * 3) continue;
        for (const w of segRects(row)) {
          const cx = Math.max(w.x, Math.min(ball.x, w.x + w.w)), cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
          const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
          if (d >= r) continue;
          if (row.spike) { die(); return; }
          const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
          ball.x += nx * (r - d); ball.y += ny * (r - d);
          const vn = ball.vx * nx + ball.vy * ny; if (vn < 0) { ball.vx -= vn * nx * 1.15; ball.vy -= vn * ny * 1.15; }
          if (ny < -0.6) { ball.grounded = true; ball.vy = Math.min(ball.vy, 0); }
        }
      }
    }

    // landing ends the streak
    if (ball.grounded && !wasGrounded) {
      if (streak >= 3) popup(`×${streak} CHAIN`, ball.x, ball.y - r * 3, '#3ff2c4');
      streak = 0; tone(150, 0.06, 'triangle', 0.15); buzz(8);
    }

    // passing a row scores the current multiplier
    for (const row of rows) {
      if (!row.passed && row.y + BAR_H() < ball.y - r) {
        row.passed = true; streak++; bestStreak = Math.max(bestStreak, streak);
        score += streak;
        tone(note(streak - 1), 0.12, 'triangle', 0.2);
        if (streak >= 2) popup('+' + streak, ball.x + r * 2, ball.y, streak >= 5 ? '#ff5a36' : '#f1eefc');
        if (streak === 5 || streak === 10) { buzz([20, 30, 20]); shake = 0.3; }
      }
      if (row.gem && !row.gem.taken) {
        const gx = row.gem.x + row.shift, gy = row.y + row.gem.dy;
        if (Math.hypot(ball.x - gx, ball.y - gy) < r * 1.8) {
          row.gem.taken = true; runGems++;
          tone(1320, 0.15, 'sine', 0.2, 1.5); buzz(12);
          for (let i = 0; i < 12; i++) { const a = Math.random() * 6.28, s = 40 + Math.random() * 120; particles.push({ x: gx, y: gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: '#3ff2c4' }); }
        }
      }
    }

    // ceiling spikes
    if (ball.y - r < SPIKE_H + 2) { die(); return; }
    // near-miss warning
    if (ball.y - r < H * 0.14 && Math.random() < dt * 4) buzz(10);

    trail.push({ x: ball.x, y: ball.y }); if (trail.length > 10) trail.shift();
  }

  function popup(text, x, y, color) { popups.push({ text, x, y, color, life: 1 }); }

  // --- rendering ---
  function draw() {
    ctx.save();
    if (shake > 0.01) ctx.translate((Math.random() - .5) * 14 * shake, (Math.random() - .5) * 14 * shake);
    ctx.fillStyle = '#15132e'; ctx.fillRect(-20, -20, W + 40, H + 40);
    // depth lines scrolling with the floors, so speed is felt
    ctx.strokeStyle = 'rgba(241,238,252,.04)'; ctx.lineWidth = 1;
    const off = (time * (speed || 0)) % 40;
    for (let y = -off; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // danger glow at the top as the ball nears it
    if (ball) {
      const danger = Math.max(0, 1 - (ball.y - SPIKE_H) / (H * 0.3));
      if (danger > 0) { const g = ctx.createLinearGradient(0, 0, 0, H * .3); g.addColorStop(0, `rgba(255,90,54,${danger * .5})`); g.addColorStop(1, 'rgba(255,90,54,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * .3); }
    }
    ctx.fillStyle = '#ff5a36';
    for (let x = 0; x < W; x += 14) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 7, SPIKE_H); ctx.lineTo(x + 14, 0); ctx.fill(); }

    if (rows) for (const row of rows) {
      for (const w of segRects(row)) {
        ctx.fillStyle = row.spike ? '#ff5a36' : row.moving ? '#7a6ff0' : '#4d47a8';
        ctx.beginPath(); ctx.roundRect(w.x, w.y, w.w, w.h, w.h / 2); ctx.fill();
        if (row.spike) { ctx.fillStyle = '#ffb199'; for (let x = w.x + 4; x < w.x + w.w - 6; x += 10) { ctx.beginPath(); ctx.moveTo(x, w.y); ctx.lineTo(x + 5, w.y - 6); ctx.lineTo(x + 10, w.y); ctx.fill(); } }
        else { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(w.x + w.h / 2, w.y + 1, Math.max(0, w.w - w.h), 2); }
      }
      if (row.gem && !row.gem.taken) {
        const gx = row.gem.x + row.shift, gy = row.y + row.gem.dy, s = R() * 0.7, bob = Math.sin(time * 5 + gx) * 2;
        ctx.save(); ctx.translate(gx, gy + bob); ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#3ff2c4'; ctx.shadowColor = '#3ff2c4'; ctx.shadowBlur = 12; ctx.fillRect(-s / 2, -s / 2, s, s); ctx.restore();
      }
    }

    if (ball && state !== 'dead') {
      const skin = SKINS[save.skin];
      trail.forEach((p, i) => { ctx.globalAlpha = i / trail.length * 0.35; ctx.fillStyle = skin.trail; ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * (0.4 + i / trail.length * 0.5), 0, 6.3); ctx.fill(); });
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(ball.x - ball.r * .35, ball.y - ball.r * .4, ball.r * .1, ball.x, ball.y, ball.r);
      g.addColorStop(0, skin.core); g.addColorStop(1, skin.edge);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.3); ctx.fill();
      if (save.skin === 5) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); }
    }

    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.font = '18px Bungee, Impact, sans-serif'; ctx.fillText(p.text, p.x, p.y); }
    ctx.globalAlpha = 1;

    if (state === 'playing') {
      ctx.fillStyle = '#f1eefc'; ctx.font = '34px Bungee, Impact, sans-serif'; ctx.fillText(score, W / 2, SPIKE_H + 34);
      if (streak >= 2) { ctx.fillStyle = streak >= 5 ? '#ff5a36' : '#3ff2c4'; ctx.font = '15px Bungee, Impact, sans-serif'; ctx.fillText('×' + streak, W / 2, SPIKE_H + 62); }
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    readTilt();
    if (state === 'playing') update(dt);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt * 1.4; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 40 * dt; p.life -= dt * 1.5; }
    popups = popups.filter(p => p.life > 0);
    shake *= Math.pow(0.05, dt);
    draw();
    requestAnimationFrame(frame);
  }

  // idle preview behind the intro card
  newRun(); state = 'intro';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
